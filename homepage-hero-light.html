<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3J's Auto Body — Home Hero</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Montserrat',sans-serif;background:#fff;color:#1a1a1a;overflow-x:hidden;}

    .hero{
      position:relative;
      min-height:700px;
      display:flex;align-items:center;justify-content:center;
      text-align:center;
      padding:80px 24px;
      overflow:hidden;
      background:#fff;
    }

    /* Soft red center glow */
    .hero::after{
      content:'';position:absolute;inset:0;
      background:radial-gradient(ellipse at center,rgba(139,0,0,0.05) 0%,transparent 65%);
      pointer-events:none;z-index:0;
    }

    /* Diagonal stripe — very subtle */
    .hero-stripe{
      position:absolute;top:0;left:0;width:100%;height:100%;
      background-image:repeating-linear-gradient(
        -55deg,
        rgba(0,0,0,0.012) 0px,
        rgba(0,0,0,0.012) 1px,
        transparent 1px,
        transparent 48px
      );
      pointer-events:none;z-index:0;
    }

    /* Truck watermarks */
    .truck-right{
      position:absolute;
      right:-60px;
      bottom:0;
      width:620px;
      opacity:0.055;
      pointer-events:none;
      z-index:0;
    }
    .truck-left{
      position:absolute;
      left:-200px;
      bottom:0;
      width:540px;
      opacity:0.028;
      pointer-events:none;
      z-index:0;
      transform:scaleX(-1);
    }

    .hero-content{
      position:relative;z-index:1;
      max-width:860px;margin:0 auto;
    }

    /* Main headline */
    .hero-headline{
      font-size:clamp(38px,7vw,88px);
      font-weight:900;
      letter-spacing:-2.5px;
      line-height:0.95;
      text-transform:uppercase;
      margin-bottom:10px;
    }
    .hero-headline .line-dark{color:#1a1a1a;}
    .hero-headline .line-red{color:#8B0000;}

    /* Divider */
    .hero-rule{
      width:56px;height:3px;
      background:#8B0000;border-radius:2px;
      margin:28px auto;
    }

    /* Body copy */
    .hero-body{
      font-size:clamp(14px,1.8vw,18px);
      font-weight:500;
      color:#666;
      line-height:1.85;
      max-width:640px;
      margin:0 auto 36px;
    }
    .hero-body .promise{
      display:block;
      font-size:clamp(15px,2vw,20px);
      font-weight:800;
      color:#1a1a1a;
      margin:16px 0 8px;
      letter-spacing:-0.3px;
    }
    .hero-body .since{
      display:block;
      font-size:clamp(11px,1.2vw,13px);
      font-weight:700;
      letter-spacing:2px;
      text-transform:uppercase;
      color:#aaa;
      margin-top:14px;
    }

    /* CTA buttons */
    .hero-ctas{
      display:flex;justify-content:center;
      flex-wrap:wrap;gap:12px;
      margin-top:40px;
    }
    .btn-primary{
      display:inline-flex;align-items:center;gap:8px;
      background:#8B0000;color:#fff;
      font-family:'Montserrat',sans-serif;
      font-size:13px;font-weight:800;
      text-decoration:none;
      padding:15px 32px;border-radius:8px;
      border:2px solid transparent;
      transition:background 0.2s;
      letter-spacing:0.5px;text-transform:uppercase;
    }
    .btn-primary:hover{background:#A00000;}
    .btn-secondary{
      display:inline-flex;align-items:center;gap:8px;
      background:transparent;color:#1a1a1a;
      font-family:'Montserrat',sans-serif;
      font-size:13px;font-weight:800;
      text-decoration:none;
      padding:15px 32px;border-radius:8px;
      border:2px solid #d0d0d0;
      transition:border-color 0.2s,color 0.2s;
      letter-spacing:0.5px;text-transform:uppercase;
    }
    .btn-secondary:hover{border-color:#8B0000;color:#8B0000;}

    /* Bottom red bar */
    .hero-bottom-bar{
      position:absolute;bottom:0;left:0;right:0;
      height:3px;
      background:linear-gradient(to right,transparent,#8B0000 25%,#8B0000 75%,transparent);
    }

    /* Scroll hint */
    .scroll-hint{
      position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
      display:flex;flex-direction:column;align-items:center;gap:6px;
      opacity:0.2;z-index:1;
    }
    .scroll-hint span{font-size:9px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#1a1a1a;}
    .scroll-arrow{width:1px;height:32px;background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,0.5));animation:drop 1.6s infinite;}
    @keyframes drop{0%,100%{transform:translateY(-4px);opacity:0;}50%{transform:translateY(4px);opacity:1;}}

    @media(max-width:900px){
      .truck-left{display:none;}
      .truck-right{width:420px;right:-30px;}
    }
    @media(max-width:600px){
      .hero{min-height:auto;padding:72px 20px 80px;}
      .hero-ctas{flex-direction:column;align-items:center;}
      .btn-primary,.btn-secondary{width:100%;max-width:280px;justify-content:center;}
      .truck-right{display:none;}
    }
  </style>
</head>
<body>

  <div class="hero-content">

    <h1 class="hero-headline">
      <span class="line-dark">30+ Years.</span><br>
      <span class="line-dark">One Location.</span><br>
      <span class="line-red">One Family.</span>
    </h1>

    <div class="hero-rule"></div>

    <div class="hero-body">
      No corporate. No runaround. No ticket numbers.<br>
      Just James, his crew, and the promise that
      <span class="promise">we'll know your name before we touch your car.</span>
      <span class="since">Serving Signal Hill since 1991 — and we're not going anywhere.</span>
    </div>

    <div class="hero-ctas">

  <div class="hero-bottom-bar"></div>

  <div class="scroll-hint">
    <span>Explore</span>

</section>

<script>
  function reportHeight(){
    var h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
    window.parent.postMessage(JSON.stringify({height:h}),'*');
  }
  window.addEventListener('load', reportHeight);
  window.addEventListener('resize', reportHeight);
</script>
</body>
</html>
