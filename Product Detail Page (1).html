<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Hard Tri-Fold Flip-Up Cover — Tonneau Cover · RLSH Truck &amp; Jeep Outfitters</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#ffffff; --surface:#ffffff; --surface2:#f4f4f1;
    --border:rgba(20,18,14,.08); --border-strong:rgba(20,18,14,.18);
    --fg:#1a1815; --fg-muted:rgba(26,24,21,.62); --fg-dim:rgba(26,24,21,.42);
    --accent:#8B0000;
    --display:'Barlow Condensed', Impact, sans-serif;
    --body:'Inter', system-ui, sans-serif;
    --mono:'JetBrains Mono', ui-monospace, monospace;
  }
  *,*::before,*::after { box-sizing: border-box; }
  html,body { margin:0; padding:0; overflow-x:hidden; }
  body { font-family: var(--body); background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  svg { display:inline-block; vertical-align: middle; }
  ::selection { background: var(--accent); color:#fff; }

  /* Page reveal */
  @keyframes pageFadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pageFadeDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pageFade { from { opacity: 0; } to { opacity: 1; } }
  .hdr { animation: pageFadeDown .55s cubic-bezier(.2,.7,.2,1) both; }
  .crumbs { animation: pageFadeUp .6s cubic-bezier(.2,.7,.2,1) both; animation-delay: .08s; }
  .pdp-top > .gallery { animation: pageFadeUp .75s cubic-bezier(.2,.7,.2,1) both; animation-delay: .14s; }
  .pdp-top > .pdp-info { animation: pageFadeUp .75s cubic-bezier(.2,.7,.2,1) both; animation-delay: .22s; }
  .pdp-tabs { animation: pageFadeUp .7s cubic-bezier(.2,.7,.2,1) both; animation-delay: .34s; }
  .related, .faq, .recently-viewed { animation: pageFade .7s ease both; animation-delay: .42s; }
  @media (prefers-reduced-motion: reduce) {
    .hdr, .crumbs, .pdp-top > .gallery, .pdp-top > .pdp-info, .pdp-tabs, .related, .faq, .recently-viewed { animation: none; }
  }

  /* Buttons */
  .btn-primary { background: var(--accent); color:#fff; border:0; padding: 12px 18px; font-family: var(--display); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; cursor: pointer; transition: filter .15s, transform .1s; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-ghost { background: transparent; color: var(--fg); border: 1px solid var(--border-strong); padding: 12px 18px; font-family: var(--display); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; cursor: pointer; }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  /* Header — matches catalog */
  .hdr { position: sticky; top: 0; z-index: 50; background: rgba(10,10,12,.97); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,.08); }
  .hdr-promo { background: #000; color: #fff; font-size: 12px; height: 34px; overflow: hidden; display:flex; align-items:center; mask-image: linear-gradient(to right, transparent 0%, #000 10%, #000 90%, transparent 100%); -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 10%, #000 90%, transparent 100%); }
  .hdr-promo .bolt { color: var(--accent); display:inline-flex; }
  .hdr-promo .bolt svg { width: 14px; height: 14px; }
  .hdr-ticker { display:flex; white-space:nowrap; animation: ticker-scroll 38s linear infinite; }
  .hdr-ticker-item { display:inline-flex; align-items:center; gap: 8px; padding: 0 60px; }
  @keyframes ticker-scroll { 0% { transform:translateX(0); } 100% { transform:translateX(-50%); } }

  .hdr-main { display: grid; grid-template-columns: auto 1fr auto; gap: 24px; align-items: center; padding: 12px 24px; }
  .logo { display:flex; align-items:center; gap: 10px; }
  .logo-mark { display:inline-flex; align-items:center; justify-content:center; width:46px; height:46px; background: var(--accent); color:#fff; font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: .04em; transform: skewX(-8deg); }
  .logo-word { font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: .04em; color: #fff; line-height: 1; }
  .logo-word small { display: block; font-size: 10px; font-weight: 500; color: rgba(255,255,255,.5); letter-spacing: .14em; margin-top: 2px; }

  .search { display:flex; align-items:center; gap: 8px; max-width: 600px; width: 100%; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); padding: 0 14px; height: 42px; }
  .search:focus-within { border-color: var(--accent); }
  .search-ico { color: rgba(255,255,255,.4); display:inline-flex; }
  .search-ico svg { width: 18px; height: 18px; }
  .search input { flex:1; background: transparent; border: 0; color: #fff; font-size: 14px; outline: none; min-width: 0; }
  .search input::placeholder { color: rgba(255,255,255,.3); }

  .hdr-actions { display:flex; align-items:center; gap: 10px; }
  .garage-pill { display:flex; align-items:center; gap: 12px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.15); color: #fff; padding: 8px 14px; cursor: pointer; transition: border-color .15s, background .15s; }
  .garage-pill:hover { border-color: var(--accent); background: rgba(255,255,255,.11); }
  .garage-pill-ico { color: var(--accent); display:inline-flex; flex-shrink:0; }
  .garage-pill-ico svg { width: 24px; height: 24px; }
  .garage-pill-txt { display:flex; flex-direction: column; align-items: flex-start; line-height: 1.15; }
  .garage-pill-label { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.45); }
  .garage-pill-vehicle { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .03em; color: #fff; }

  .hdr-nav { display:flex; align-items: center; gap: 4px; padding: 0 18px; border-top: 1px solid rgba(255,255,255,.07); overflow-x: auto; scrollbar-width: none; }
  .hdr-nav::-webkit-scrollbar { display: none; }
  .nav-item { font-family: var(--display); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; padding: 14px 14px; color: rgba(255,255,255,.5); white-space: nowrap; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s, border-color .15s; }
  .nav-item:hover { color: #fff; }
  .nav-item.active { color: #fff; border-bottom-color: var(--accent); }

  /* Crumbs */
  .crumbs { max-width: 1440px; margin: 0 auto; padding: 16px 24px 12px; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-muted); display:flex; align-items:center; gap: 10px; flex-wrap: wrap; }
  .crumbs a { cursor: pointer; }
  .crumbs a:hover { color: var(--accent); }
  .crumb-sep { color: var(--fg-dim); }
  .crumb-now { color: var(--accent); font-weight: 500; }

  /* PDP Layout */
  .pdp { max-width: 1440px; margin: 0 auto; padding: 0 24px 80px; }
  .pdp-top { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 48px; align-items: start; padding-top: 8px; }

  /* Gallery — vertical thumbs left, large image right */
  .gallery { display: grid; grid-template-columns: 92px 1fr; gap: 14px; align-items: start; }
  .gallery.bottom-thumbs { grid-template-columns: 1fr; gap: 12px; }
  .gallery.bottom-thumbs .gal-thumbs { flex-direction: row; order: 2; overflow-x: auto; padding-bottom: 4px; }
  .gallery.bottom-thumbs .gal-thumb { width: 88px; height: 88px; flex-shrink: 0; }
  .gallery.stacked { grid-template-columns: 1fr; gap: 10px; }
  .gallery.stacked .gal-thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .gallery.stacked .gal-thumb { width: 100%; height: auto; aspect-ratio: 1; }

  .gal-thumbs { display:flex; flex-direction: column; gap: 10px; }
  .gal-thumb { width: 92px; height: 92px; background: var(--surface2); border: 1.5px solid var(--border); cursor: pointer; overflow: hidden; transition: border-color .15s; padding: 0; position: relative; }
  .gal-thumb:hover { border-color: var(--border-strong); }
  .gal-thumb.active { border-color: var(--accent); }
  .gal-thumb image-slot { width: 100%; height: 100%; display: block; --img-slot-bg: var(--surface2); --img-slot-border: transparent; --img-slot-radius: 0; border-radius: 0; }
  .gal-main { position: relative; aspect-ratio: 4/3; background: var(--surface2); overflow: hidden; border: 1px solid var(--border); }
  .gal-main image-slot { width: 100%; height: 100%; display: block; --img-slot-bg: var(--surface2); --img-slot-border: transparent; --img-slot-radius: 0; border-radius: 0; }
  .gal-badge { position: absolute; top: 14px; left: 14px; display:inline-flex; align-items: center; gap: 6px; background: rgba(62,194,124,.16); border: 1px solid rgba(62,194,124,.55); color: #1f7e3e; padding: 6px 10px; font-family: var(--mono); font-size: 10px; letter-spacing: .15em; font-weight: 600; backdrop-filter: blur(6px); z-index: 2; }
  .gal-badge svg { width: 12px; height: 12px; }
  .gal-zoom { position: absolute; bottom: 14px; right: 14px; background: rgba(10,10,12,.85); border: 1px solid rgba(255,255,255,.15); color: #fff; padding: 8px 12px; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; z-index: 2; }
  .gal-zoom:hover { background: var(--accent); border-color: var(--accent); }

  /* Info column */
  .pdp-info { display:flex; flex-direction: column; gap: 14px; }
  .pdp-info.sticky { position: sticky; top: 130px; align-self: start; max-height: calc(100vh - 150px); overflow-y: auto; padding-right: 4px; scrollbar-width: thin; }
  .pdp-info.sticky::-webkit-scrollbar { width: 5px; }
  .pdp-info.sticky::-webkit-scrollbar-thumb { background: var(--border-strong); }
  .pdp-brand { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); font-weight: 500; }
  .pdp-brand .sep { color: var(--fg-dim); margin: 0 8px; }
  .pdp-title { font-family: var(--display); font-weight: 800; font-size: clamp(34px, 4vw, 48px); line-height: .98; letter-spacing: -.005em; text-transform: uppercase; margin: 0; color: var(--fg); }
  .pdp-sub { font-size: 14px; color: var(--fg-muted); line-height: 1.55; max-width: 480px; margin: 0; }

  .pdp-rating { display:flex; align-items: center; gap: 12px; padding: 4px 0 4px; flex-wrap: wrap; }
  .stars { display:inline-flex; gap: 2px; }
  .stars svg { width: 16px; height: 16px; fill: var(--accent); }
  .stars svg.off { fill: var(--border-strong); }
  .pdp-rating-num { font-family: var(--mono); font-size: 12px; color: var(--fg-muted); }
  .pdp-rating-link { font-size: 12px; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

  /* Fitment block */
  .pdp-fit { display:flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--surface2); border-top: 4px solid #097530; }
  .pdp-fit-ico { width: 36px; height: 36px; background: transparent; color: #097530; display:inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .pdp-fit-ico svg { width: 20px; height: 20px; }
  .pdp-fit-body { flex: 1; min-width: 0; }
  .pdp-fit-label { font-family: var(--mono); font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--fg-dim); }
  .pdp-fit-vehicle { font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: .02em; text-transform: uppercase; color: var(--fg); margin-top: 2px; }
  .pdp-fit-link { font-size: 12px; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-weight: 500; }

  /* Variants */
  .variants { display:flex; flex-direction: column; gap: 16px; padding: 18px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .var-group-label { font-family: var(--mono); font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--fg-dim); margin-bottom: 8px; }
  .var-options { display:flex; gap: 8px; flex-wrap: wrap; }
  .var-chip { background: transparent; border: 1.5px solid var(--border-strong); color: var(--fg); padding: 10px 16px; font-family: var(--display); font-weight: 600; letter-spacing: .04em; font-size: 13px; cursor: pointer; transition: all .15s; min-width: 80px; text-align: center; }
  .var-chip:hover { border-color: var(--fg); }
  .var-chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .var-chip.unavailable { opacity: .35; cursor: not-allowed; text-decoration: line-through; }
  .var-color { width: 44px; min-width: 44px; height: 44px; padding: 0; position: relative; border-radius: 0; }
  .var-color .swatch { position: absolute; inset: 4px; }
  .var-color.on { border-color: var(--fg); }
  .var-color.on::after { content: ''; position: absolute; inset: -4px; border: 1.5px solid var(--accent); pointer-events: none; }

  /* Price + CTA */
  .pdp-price-row { display:flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .pdp-price { font-family: var(--display); font-weight: 800; font-size: 42px; letter-spacing: .01em; line-height: 1; color: var(--fg); }
  .pdp-price-was { font-size: 17px; color: var(--fg-dim); text-decoration: line-through; }
  .pdp-price-save { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; color: var(--accent); background: rgba(139,0,0,.08); padding: 4px 8px; font-weight: 600; }
  .pdp-stock { display:inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: #097530; padding-top: 6px; }
  .pdp-stock-dot { width: 8px; height: 8px; border-radius: 50%; background: #097530; }

  .pdp-actions { display:grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: stretch; }
  .qty-stepper { display:grid; grid-template-columns: 36px 1fr 36px; align-items: center; border: 1.5px solid var(--border-strong); background: var(--surface); height: 52px; }
  .qty-stepper button { background: transparent; border: 0; color: var(--fg); cursor: pointer; height: 100%; font-size: 18px; font-family: var(--display); font-weight: 600; }
  .qty-stepper button:hover { background: var(--surface2); color: var(--accent); }
  .qty-stepper input { width: 100%; height: 100%; text-align: center; border: 0; border-left: 1px solid var(--border); border-right: 1px solid var(--border); background: transparent; font-family: var(--mono); font-size: 14px; color: var(--fg); outline: none; -moz-appearance: textfield; }
  .qty-stepper input::-webkit-outer-spin-button, .qty-stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .pdp-cta { background: var(--accent); color: #fff; border: 0; height: 52px; font-family: var(--display); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 15px; cursor: pointer; transition: filter .15s; display:inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 0 18px; }
  .pdp-cta:hover { filter: brightness(1.12); }
  .pdp-cta svg { width: 18px; height: 18px; }

  .pdp-secondary { display:flex; gap: 8px; flex-wrap: wrap; }
  .pdp-sec-btn { background: transparent; border: 1px solid var(--border-strong); color: var(--fg); padding: 10px 14px; font-family: var(--display); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: 12px; cursor: pointer; display:inline-flex; align-items: center; gap: 6px; }
  .pdp-sec-btn:hover { border-color: var(--accent); color: var(--accent); }
  .pdp-sec-btn svg { width: 14px; height: 14px; }

  /* Trust badges */
  .trust { display:grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 16px 0 4px; border-top: 1px solid var(--border); margin-top: 4px; }
  .trust-item { display:flex; gap: 10px; align-items: flex-start; }
  .trust-ico { color: var(--accent); flex-shrink: 0; padding-top: 2px; }
  .trust-ico svg { width: 22px; height: 22px; }
  .trust-text { font-size: 11px; line-height: 1.4; }
  .trust-text strong { display: block; font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
  .trust-text span { color: var(--fg-muted); }

  /* Quick highlights bullets */
  .highlights { padding: 16px 0 4px; }
  .highlights-title { font-family: var(--mono); font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--fg-dim); margin-bottom: 10px; }
  .highlights ul { list-style: none; padding: 0; margin: 0; display:flex; flex-direction: column; gap: 8px; }
  .highlights li { display:flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 1.5; color: var(--fg); }
  .highlights li::before { content: ''; display:inline-block; width: 6px; height: 6px; background: var(--accent); margin-top: 8px; flex-shrink: 0; }

  /* Tabs */
  .pdp-tabs { margin-top: 56px; border-top: 1px solid var(--border); padding-top: 0; }
  .tabs-bar { display:flex; gap: 0; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
  .tabs-bar::-webkit-scrollbar { display: none; }
  .tab-btn { background: transparent; border: 0; padding: 18px 22px; font-family: var(--display); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; color: var(--fg-muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; transition: color .15s, border-color .15s; }
  .tab-btn:hover { color: var(--fg); }
  .tab-btn.on { color: var(--fg); border-bottom-color: var(--accent); }
  .tab-count { font-family: var(--mono); font-weight: 400; font-size: 11px; margin-left: 6px; color: var(--fg-dim); letter-spacing: .04em; text-transform: none; }
  .tab-panel { padding: 32px 0; display:grid; grid-template-columns: 1fr 340px; gap: 48px; align-items: start; }

  /* Stacked mode (no tabs) */
  .stacked-sections { margin-top: 56px; display:flex; flex-direction: column; gap: 56px; }
  .stacked-section { border-top: 1px solid var(--border); padding-top: 32px; }
  .stacked-section-head { display:flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; gap: 12px; flex-wrap: wrap; }
  .stacked-section-head h2 { font-family: var(--display); font-weight: 800; font-size: 28px; letter-spacing: .04em; text-transform: uppercase; margin: 0; }
  .stacked-section-head .sec-num { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--fg-dim); }

  /* Description panel */
  .desc h3 { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .03em; text-transform: uppercase; margin: 0 0 12px; }
  .desc p { font-size: 15px; line-height: 1.65; color: var(--fg); margin: 0 0 16px; max-width: 680px; }
  .desc p strong { font-weight: 600; }
  .feat-grid { display:grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin: 18px 0 8px; }
  .feat-card { background: var(--surface2); border-top: 2px solid var(--accent); padding: 14px 16px; }
  .feat-card-title { font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 4px; }
  .feat-card-body { font-size: 12px; color: var(--fg-muted); line-height: 1.5; }

  /* Specs */
  .specs-table { width: 100%; border-collapse: collapse; border-top: 1px solid var(--border); }
  .specs-table tr { border-bottom: 1px solid var(--border); }
  .specs-table td { padding: 12px 0; font-size: 13px; vertical-align: top; }
  .specs-table td:first-child { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-muted); width: 40%; }
  .specs-table td:last-child { color: var(--fg); font-weight: 500; }

  /* Aside (in tab area) */
  .tab-aside { display:flex; flex-direction: column; gap: 16px; }
  .install-card { background: var(--surface2); border: 1px solid var(--border); padding: 20px; }
  .install-card-eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--fg-dim); margin-bottom: 6px; }
  .install-card h4 { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .03em; text-transform: uppercase; margin: 0 0 8px; }
  .install-card p { font-size: 13px; line-height: 1.5; color: var(--fg-muted); margin: 0 0 12px; }
  .install-card .row-btns { display:flex; gap: 8px; flex-wrap: wrap; }
  .install-card .row-btns a { font-family: var(--display); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: 11px; padding: 8px 12px; border: 1px solid var(--border-strong); cursor: pointer; }
  .install-card .row-btns a:hover { border-color: var(--accent); color: var(--accent); }

  /* Reviews */
  .reviews-summary { display:grid; grid-template-columns: 200px 1fr; gap: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--border); margin-bottom: 24px; align-items: start; }
  .rev-big-num { font-family: var(--display); font-weight: 800; font-size: 72px; line-height: 1; color: var(--fg); }
  .rev-stars { padding-top: 8px; }
  .rev-stars svg { width: 18px; height: 18px; }
  .rev-count { font-family: var(--mono); font-size: 11px; color: var(--fg-muted); margin-top: 6px; }
  .rev-bars { display:flex; flex-direction: column; gap: 6px; }
  .rev-bar-row { display:grid; grid-template-columns: 28px 1fr 36px; gap: 10px; align-items: center; font-size: 12px; }
  .rev-bar-row .lbl { font-family: var(--mono); color: var(--fg-muted); }
  .rev-bar-track { height: 6px; background: var(--border); position: relative; }

  { q: 'How weather-tight is it?', a: 'EPDM rubber seals run along all four sides and integrated drain tubes route water out below the bed. In real-world use — snow, heavy rain, pressure washing — the bed stays dry. The rotational latches keep the panels under uniform pressure for a consistent seal.' },
  { q: 'Can I drive with it folded up?', a: 'Yes. The cover folds flat against the cab and locks in place with included prop rods. Manufacturer recommends a 70 mph maximum when folded, which is more than enough for most highway driving.' },

  const [open, setOpen] = useState(0);
  const plus = <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg>;

      <p className="faq-sub">Everything you need to know before bringing your truck in.</p>

        {items.map((it, i) =>
        <div key={i} className={`faq-item ${open === i ? 'open' : ''}`}>
            <button className="faq-q" aria-expanded={open === i} onClick={() => setOpen(open === i ? -1 : i)}>
              {it.q}
              {plus}
            </button>
            <div className="faq-a-wrap"><div className="faq-a-inner"><div className="faq-a">{it.a}</div></div></div>
          </div>
        )}
      </div>
      <div className="faq-cta">
        <a href="tel:+15624246744" className="faq-btn-primary">
          <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.7 10.82 19.79 19.79 0 01.67 2.18 2 2 0 012.66 0h3a2 2 0 012 1.72c.13 1 .36 1.97.7 2.91a2 2 0 01-.45 2.11L6.91 7.74a16 16 0 006.29 6.29l1-.99a2 2 0 012.11-.45c.94.34 1.91.57 2.91.7A2 2 0 0122 16.92z" /></svg>

        <a href="#" className="faq-btn-secondary">

          Chat With a Spec Tech
        </a>
      </div>
    </section>);

}

}
