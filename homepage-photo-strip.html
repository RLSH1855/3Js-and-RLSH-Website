<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Services Strip | 3J's Auto Body</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    html{overflow-x:hidden;overscroll-behavior:none;max-width:100%;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{font-family:'Montserrat',sans-serif;overflow-x:hidden;background:#000;}

    .strip{
      display:flex;
      width:100%;
      height:380px;
    }

    .panel{
      flex:1;
      position:relative;
      overflow:hidden;
      cursor:pointer;
    }

    .panel-bg{
      position:absolute;
      inset:0;
      background-size:cover;
      background-position:center;
      transition:transform 0.5s ease;
    }
    .panel:hover .panel-bg{
      transform:scale(1.05);
    }

    /* Dark overlay */
    .panel-overlay{
      position:absolute;
      inset:0;
      background:linear-gradient(160deg, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0.35) 100%);
      transition:background 0.4s ease;
    }
    .panel:hover .panel-overlay{
      background:linear-gradient(160deg, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.50) 100%);
    }

    /* Red left accent bar */
    .panel::before{
      content:'';
      position:absolute;
      top:0;left:0;
      width:4px;height:100%;
      background:#8B0000;
      z-index:3;
    }

    .panel-content{
      position:relative;
      z-index:4;
      padding:28px 24px;
      height:100%;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
    }

    .panel-eyebrow{
      font-size:9px;font-weight:800;letter-spacing:3px;
      text-transform:uppercase;color:#cc2222;
      margin-bottom:8px;
    }

    .panel-title{
      font-size:clamp(18px,2.2vw,26px);
      font-weight:900;
      color:#fff;
      letter-spacing:-0.3px;
      line-height:1.15;
      text-transform:uppercase;
      margin-bottom:12px;
    }

    .panel-sub{
      font-size:12px;font-weight:500;
      color:rgba(255,255,255,0.78);
      line-height:1.65;
      max-width:280px;
    }

    .panel-link{
      margin-top:auto;
      display:inline-flex;align-items:center;gap:7px;
      font-size:11px;font-weight:800;letter-spacing:1.5px;
      text-transform:uppercase;color:#fff;
      text-decoration:none;
      border-bottom:2px solid #8B0000;
      padding-bottom:2px;
      width:fit-content;
      transition:color 0.2s,border-color 0.2s;
    }
    .panel-link:hover{color:#ff4444;border-color:#ff4444;}
    .panel-link::after{content:'→';}

    /* ── Accessories label chips ── */
    .acc-labels{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin-top:14px;
    }
    .acc-chip{
      font-size:9px;font-weight:800;letter-spacing:1.2px;
      text-transform:uppercase;
      color:#fff;
      background:rgba(139,0,0,0.75);
      border:1px solid rgba(255,255,255,0.2);
      border-radius:3px;
      padding:4px 8px;
      backdrop-filter:blur(4px);
      white-space:nowrap;
    }

    /* ── Panel separators ── */
    /* Desktop: no divider — panels sit edge to edge */
    .panel-sep{display:none;}
    .panel-sep .sep-v{display:none;}
    .panel-sep .sep-h{display:none;}

    @media(max-width:680px){
      .strip{flex-direction:column;height:auto;}
      .panel{height:280px;flex:none;}
      .panel-sep{
        display:block;
        width:100%;
        height:3px;
        background:#8B0000;
      }
      .panel-sep .sep-v,.panel-sep .sep-h{display:none;}
    }
  </style>
</head>
<body>

<div class="strip">

  <!-- Panel 1: Collision -->
  <div class="panel">
    <div class="panel-bg" style="background-image:url(https://rlsh1855.github.io/3Js-and-RLSH-Website/collision-before-after.png);background-position:center center;background-size:cover;"></div>
    <div class="panel-overlay"></div>
    <div class="panel-content">
      <p class="panel-eyebrow">Auto Body</p>
      <h2 class="panel-title">Collision<br>Repair</h2>
      <p class="panel-sub">From minor dents to major damage — we restore your vehicle to factory condition.</p>
      <a class="panel-link" href="https://rlsh1855.github.io/3Js-and-RLSH-Website/body-paint-repairs.html" target="_top">Learn More</a>
    </div>
  </div>

  <!-- Divider -->
  <div class="panel-sep">
    <img class="sep-v" src="https://rlsh1855.github.io/3Js-and-RLSH-Website/divider-strip-white.png" alt="">
    <img class="sep-h" src="https://rlsh1855.github.io/3Js-and-RLSH-Website/divider-strip-white.png" alt="">
  </div>

  <!-- Panel 2: Rhino Linings -->
  <div class="panel">
    <div class="panel-bg" style="background-image:url('https://rlsh1855.github.io/3Js-and-RLSH-Website/Jeep%20Bedliner%20Photo%20Strip.png');background-position:center center;background-size:cover;"></div>
    <div class="panel-overlay"></div>
    <div class="panel-content">
      <p class="panel-eyebrow">Spray-On Protection</p>
      <h2 class="panel-title">Rhino<br>Linings</h2>
      <p class="panel-sub">Truck beds, Jeeps, and more — the toughest protective coating available.</p>
      <a class="panel-link" href="https://www.3jsautobody.com/rhino-lining-quote" target="_top">Get a Quote</a>
    </div>
  </div>

  <!-- Divider -->
  <div class="panel-sep">
    <img class="sep-v" src="https://rlsh1855.github.io/3Js-and-RLSH-Website/divider-strip-white.png" alt="">
    <img class="sep-h" src="https://rlsh1855.github.io/3Js-and-RLSH-Website/divider-strip-white.png" alt="">
  </div>

  <!-- Panel 3: Accessories -->
  <div class="panel">
    <div class="panel-bg" style="background-image:url('https://rlsh1855.github.io/3Js-and-RLSH-Website/accessories-banner-truck-800x500px.png');background-position:center center;background-size:cover;"></div>
    <div class="panel-overlay"></div>
    <div class="panel-content">
      <p class="panel-eyebrow">Truck · Jeep · SUV</p>
      <h2 class="panel-title">Accessories</h2>
      <a class="panel-link" href="https://rlsh1855.github.io/3Js-and-RLSH-Website/exterior-accessories.html" target="_top">Shop All</a>
    </div>
  </div>

</div>

<script>
  function reportHeight(){
    var h = Math.max(
      document.body.scrollHeight,
      document.body.offsetHeight,
      document.documentElement.scrollHeight,
      document.documentElement.offsetHeight
    );
    window.parent.postMessage(JSON.stringify({height:h}),'*');
  }
  document.addEventListener('DOMContentLoaded', reportHeight);
  window.addEventListener('load', function(){
    [0,200,500,1000,2000,3500].forEach(function(t){ setTimeout(reportHeight,t); });
  });
  window.addEventListener('resize', reportHeight);
  if(window.ResizeObserver){ new ResizeObserver(reportHeight).observe(document.body); }),'*');
    if(window.parent !== window.parent.parent){
      window.parent.parent.postMessage(JSON.stringify({height:h}),'*');
    }
  }
  window.addEventListener('load',function(){ reportHeight(); setTimeout(reportHeight,500); });
  window.addEventListener('resize',reportHeight);
  if(window.ResizeObserver){ new ResizeObserver(reportHeight).observe(document.body); }
</script>

</body>
</html>
