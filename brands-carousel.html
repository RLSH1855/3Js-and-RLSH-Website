<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top Aftermarket Brands — Rhino Liner, BakFlip, AMP Research & More | 3J's Auto Body</title>
  <meta name="description" content="3J's Auto Body installs top aftermarket brands: Rhino Liner, BakFlip, AMP Research, WeatherTech, Extang, TruXedo, Westin, and more. Signal Hill, CA.">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Top Aftermarket Brands We Install | 3J's Auto Body">
  <meta property="og:description" content="We install and source the best aftermarket truck brands: Rhino Liner, BakFlip, AMP Research, WeatherTech, and more. Signal Hill, CA.">
  <meta property="og:site_name" content="3J's Auto Body &amp; Paint">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{overflow-x:hidden;}
    body{font-family:'Montserrat',sans-serif;background:#fff;min-height:460px;}

    .brands-section{
      background:#fff;
      padding:56px 0 72px;
      text-align:center;
    }

    .brands-header{padding:0 24px;margin-bottom:40px;}
    .brands-eyebrow{
      font-size:10px;font-weight:800;letter-spacing:3px;
      text-transform:uppercase;color:#8B0000;margin-bottom:10px;
    }
    .brands-heading{
      font-size:clamp(20px,3vw,32px);font-weight:900;
      color:#1a1a1a;letter-spacing:-0.5px;margin-bottom:6px;
    }
    .brands-heading em{font-style:normal;color:#8B0000;}
    .brands-sub{
      font-size:13px;font-weight:500;color:#888;letter-spacing:0.3px;
    }

    @media(max-width:640px){
      .brands-section{padding:24px 0 24px;}
      .brands-header{margin-bottom:20px;}
      .marquee-wrapper:last-child{margin-bottom:0;}
      .logo-card{width:130px;height:60px;padding:10px 14px;}
      .logo-card img{width:100px;height:34px;}
    }

    /* Marquee */
    .marquee-wrapper{
      width:100%;overflow:hidden;position:relative;
      margin-bottom:16px;
      padding-bottom:8px;
      -webkit-mask-image:linear-gradient(to right,transparent 0%,black 6%,black 94%,transparent 100%);
      mask-image:linear-gradient(to right,transparent 0%,black 6%,black 94%,transparent 100%);
    }
    .marquee-track{
      display:flex;align-items:center;gap:16px;width:max-content;
    }
    .marquee-track.row-1{animation:scrollLeft 32s linear infinite;}
    .marquee-track.row-2{animation:scrollRight 40s linear infinite;}
    .marquee-wrapper:hover .marquee-track{animation-play-state:paused;}

    @keyframes scrollLeft{
      0%{transform:translateX(0);}
      100%{transform:translateX(-50%);}
    }
    @keyframes scrollRight{
      0%{transform:translateX(-50%);}
      100%{transform:translateX(0);}
    }

    /* Logo card */
    .logo-card{
      display:inline-flex;align-items:center;justify-content:center;
      height:72px;
      width:160px;
      padding:12px 20px;
      background:#fff;
      border:1.5px solid #ebebeb;
      border-radius:10px;
      flex-shrink:0;
      transition:border-color 0.3s,box-shadow 0.3s;
      box-shadow:0 2px 8px rgba(0,0,0,0.04);
      cursor:default;
    }
    .logo-card:hover{
      border-color:#ccc;
      box-shadow:0 6px 24px rgba(0,0,0,0.10);
    }
    .logo-card img{
      width:120px;
      height:40px;
      object-fit:contain;
      filter:grayscale(1) opacity(0.55);
      transition:filter 0.3s;
    }
    .logo-card:hover img{
      filter:grayscale(0) opacity(1);
    }
  </style>
</head>
<body>

<section class="brands-section">

  <div class="brands-header">
    <p class="brands-eyebrow">Trusted Products</p>
    <h2 class="brands-heading">Top <em>Aftermarket Brands</em> We Install</h2>
    <p class="brands-sub">Premium brands. Professional installation. Built to last.</p>
  </div>

  <!-- Row 1 — scrolls left -->
  <div class="marquee-wrapper">
    <div class="marquee-track row-1" id="row1">
      <div class="logo-card"><img src="https://rlsh1855.github.io/3Js-and-RLSH-Website/rhino%20linings.png" alt="Rhino Liner"></div>
      <div class="logo-card"><img src="https://rlsh1855.github.io/3Js-and-RLSH-Website/brand-logo%20(1).png" alt="AMP Research"></div>
      <div class="logo-card"><img src="https://rlsh1855.github.io/3Js-and-RLSH-Website/brand-logo%20(2).png" alt="UnderCover"></div>
      <div class="logo-card"><img src="https://rlsh1855.github.io/3Js-and-RLSH-Website/brand-logo%20(4).jpeg" alt="TruXedo"></div>
      <div class="logo-card"><img src="https://rlsh1855.github.io/3Js-and-RLSH-Website/brand-logo%20(5).jpeg" alt="B&W Trailer Hitches"></div>
      <div class="logo-card"><img src="https://rlsh1855.github.io/3Js-and-RLSH-Website/brand-logo%20(6).png" alt="Extang"></div>
      <div class="logo-card"><img src="https://rlsh1855.github.io/3Js-and-RLSH-Website/brand-logo%20(7).png" alt="Bushwacker"></div>
      <div class="logo-card"><img src="https://rlsh1855.github.io/3Js-and-RLSH-Website/brand-logo%20(8).png" alt="Dee Zee"></div>
      <div class="logo-card"><img src="https://rlsh1855.github.io/3Js-and-RLSH-Website/brand-logo%20(12).jpeg" alt="BAK Industries"></div>
    </div>
  </div>

  <!-- Row 2 — scrolls right -->
  <div class="marquee-wrapper">
    <div class="marquee-track row-2" id="row2">
      <div class="logo-card"><img src="https://rlsh1855.github.io/3Js-and-RLSH-Website/brand-logo%20(9).png" alt="Rigid Industries"></div>
      <div class="logo-card"><img src="https://rlsh1855.github.io/3Js-and-RLSH-Website/brand-logo%20(10).png" alt="Air Lift"></div>
      <div class="logo-card"><img src="https://rlsh1855.github.io/3Js-and-RLSH-Website/brand-logo%20(11).png" alt="Mickey Thompson"></div>
      <div class="logo-card"><img src="https://rlsh1855.github.io/3Js-and-RLSH-Website/brand-logo%20(13).jpeg" alt="ReadyLIFT"></div>
      <div class="logo-card"><img src="https://rlsh1855.github.io/3Js-and-RLSH-Website/brand-logo%20(14).jpeg" alt="WeatherTech"></div>
      <div class="logo-card"><img src="https://rlsh1855.github.io/3Js-and-RLSH-Website/brand-logo%20(15).jpeg" alt="Retrax"></div>
      <div class="logo-card"><img src="https://rlsh1855.github.io/3Js-and-RLSH-Website/brand-logo%20(17).jpeg" alt="Smittybilt"></div>
      <div class="logo-card"><img src="https://rlsh1855.github.io/3Js-and-RLSH-Website/westin.png" alt="Westin"></div>
      <div class="logo-card"><img src="https://rlsh1855.github.io/3Js-and-RLSH-Website/husky.png" alt="Husky Liners"></div>
      <div class="logo-card"><img src="https://rlsh1855.github.io/3Js-and-RLSH-Website/bedrug.png" alt="BedRug"></div>
      <div class="logo-card"><img src="https://rlsh1855.github.io/3Js-and-RLSH-Website/curt.png" alt="CURT"></div>
      <div class="logo-card"><img src="https://rlsh1855.github.io/3Js-and-RLSH-Website/baja%20designs%20logo.png" alt="Baja Designs"></div>
      <div class="logo-card"><img src="https://rlsh1855.github.io/3Js-and-RLSH-Website/poison-spyder-logo.png" alt="Poison Spyder"></div>
      <div class="logo-card"><img src="https://rlsh1855.github.io/3Js-and-RLSH-Website/brand-logo%20(3).png" alt="TrailFX"></div>
    </div>
  </div>

</section>

<script>
  var r1 = document.getElementById('row1');
  var r2 = document.getElementById('row2');
  r1.innerHTML += r1.innerHTML;
  r2.innerHTML += r2.innerHTML;

  function reportHeight(){
    var h = Math.max(
      document.body.scrollHeight,
      document.body.offsetHeight,
      document.documentElement.scrollHeight,
      document.documentElement.offsetHeight
    );
    window.parent.postMessage(JSON.stringify({height:h}),'*');
  }
  document.addEventListener('DOMContentLoaded', reportHeight);
  window.addEventListener('load', function(){
    [0,200,500,1000,2000,3500].forEach(function(t){ setTimeout(reportHeight,t); });
  });
  window.addEventListener('resize', reportHeight);
  if(window.ResizeObserver){ new ResizeObserver(reportHeight).observe(document.body); }),'*');
  }
  window.addEventListener('load', function(){ reportHeight(); setTimeout(reportHeight,500); setTimeout(reportHeight,1500); });
  window.addEventListener('resize',reportHeight);
  if(window.ResizeObserver){ new ResizeObserver(reportHeight).observe(document.querySelector('.brands-section')); }
</script>
</body>
</html>
