<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Retooling the Shop | 3J's Auto Body & RLSH</title>
  <style>
    html,body{overflow-x:hidden;overscroll-behavior:none;max-width:100%;}
    :root{
      --crimson:#8B0000;
      --white:#ffffff;
      --navy:#010411;
      --master-spacing:0.05em;
      --data-font-weight:500;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color:var(--navy);
      color:var(--white);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      position:relative;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* Decorative background image (attached) */
    .bg {
      position: absolute;
      inset: 0;
      background-image: url('attachments/gYtBfbVCUPYq51bvc29gX.jpeg');
      background-repeat: no-repeat;
      background-position: center top;
      background-size: cover;
      filter: saturate(0.98) contrast(1.03);
      z-index: 0;
      pointer-events: none;
    }
    .bg::after{
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(180deg, rgba(1,4,17,0.35) 0%, rgba(1,4,17,0.65) 75%);
      mix-blend-mode:multiply;
      pointer-events:none;
    }

    .logo-container{
      position:absolute;
      top:28px;
      left:28px;
      display:flex;
      gap:22px;
      align-items:center;
      z-index:6;
    }
    .logo-container img{
      height:52px;
      width:auto;
      display:block;
      object-fit:contain;
      filter: drop-shadow(0 6px 18px rgba(0,0,0,0.6));
    }

    .main-wrapper{
      position:relative;
      z-index:5; /* keep above the large corner art */
      width:100%;
      max-width:980px;
      padding:36px 28px 120px;
      text-align:center;
      display:block;
    }

    .status-badge{
      display:inline-block;
      background: linear-gradient(180deg, #8f0f0a, #6b0a07);
      color: #fff;
      padding:12px 44px;
      font-weight:700;
      letter-spacing:var(--master-spacing);
      text-transform:uppercase;
      font-size:14px;
      clip-path: polygon(12% 0, 100% 0, 88% 100%, 0 100%);
      box-shadow: 0 8px 30px rgba(122,16,10,0.35), inset 0 -2px 6px rgba(0,0,0,0.25);
      margin-bottom:28px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }

    /* Headline: NO pulsing, NO animated drop-shadow or filter */
    h1.headline{
      font-size: clamp(2.6rem, 7.5vw, 5.2rem);
      line-height:0.95;
      margin:18px 0 18px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:-0.01em;
      display:inline-block;
      position:relative;
      color:transparent;
      background: linear-gradient(180deg,#f6f6f6 0%, #bdbdbd 45%, #8f8f8f 100%);
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
      text-shadow: 0 1px 0 rgba(0,0,0,0.45);
    }

    /* Subtle, smooth shine only (narrow highlight that sweeps across).
       No pulsing, no glow. */
    h1.headline::after{
      content: attr(data-text);
      position:absolute;
      inset:0;
      left:0;
      background: linear-gradient(90deg,
        transparent 14%,
        rgba(255,255,255,0.45) 20%,
        rgba(255,255,255,0.12) 26%,
        transparent 34%);
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
      mix-blend-mode:screen;
      background-size:220% 100%;
      animation: shineContinuous 8s linear infinite;
      pointer-events:none;
      opacity:0.9;
    }

    @keyframes shineContinuous{
      from{background-position:-120% 0}
      to{background-position:120% 0}
    }

    .description{
      margin: 0 auto 28px;
      max-width:720px;
      color: #e9e9e9;
      font-weight:300;
      font-size:18.5px;
      line-height:1.45;
      letter-spacing:var(--master-spacing);
      text-rendering:optimizeLegibility;
    }

    .master-data-row{
      display:flex;
      gap:28px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:18px;
      margin-bottom:72px;
      font-size:11px;
      font-weight:var(--data-font-weight);
      letter-spacing:var(--master-spacing);
      text-transform:uppercase;
      color:#fff;
      z-index:5;
    }

    .master-data-row span{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:4px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    }

    .master-data-row span::before{
      content:"•";
      color:var(--crimson);
      font-weight:900;
      margin-right:6px;
      font-size:14px;
    }

    .bottom-console{
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index:4;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 28px 20px 40px;
      pointer-events:none;
    }

    .console-art{
      position:absolute;
      bottom:0;
      left:50%;
      transform:translateX(-50%);
      width:100%;
      max-width:1400px;
      height:auto;
      pointer-events:none;
      z-index:1;
      opacity:0.9;
      background-image: url('attachments/gYtBfbVCUPYq51bvc29gX.jpeg');
      background-repeat:no-repeat;
      background-position:center bottom;
      background-size:contain;
      min-height:160px;
      filter:brightness(0.98) contrast(1.02);
    }

    /* LARGE bottom-left image scaled up toward the middle of the page */
    .corner-art {
      position: absolute;
      bottom: 0;
      left: 0;
      z-index:2;                    /* behind main content but above console-art */
      width: 60vw;                  /* scales from bottom-left toward center */
      max-width: 1200px;            /* cap on very large screens */
      min-width: 420px;             /* keep it large on medium screens */
      height: auto;
      transform-origin: left bottom;/* scale from bottom-left */
      opacity: 0.95;
      pointer-events: none;         /* decorative only */
      filter: drop-shadow(0 18px 40px rgba(0,0,0,0.55));
      mix-blend-mode: normal;
      transition: width .28s ease, opacity .28s ease;
      object-fit: contain;
    }

    /* Buttons */
    .btn-container{
      position:relative;
      z-index:5;
      display:flex;
      gap:18px;
      pointer-events:auto;
      justify-content:center;
      align-items:center;
      padding:6px;
      clip-path: polygon(8% 0, 92% 0, 100% 100%, 0 100%);
    }

    .btn{
      display:inline-block;
      min-width:220px;
      padding:14px 40px;
      text-decoration:none;
      text-align:center;
      font-size:13px;
      font-weight:var(--data-font-weight);
      letter-spacing:var(--master-spacing);
      text-transform:uppercase;
      border-radius:6px;
      transition: transform .22s ease, box-shadow .22s ease, filter .22s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    }

    .btn-home{
      background: linear-gradient(180deg,var(--crimson), #6f0000);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .btn-quote{
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      color:#fff;
      border:2px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(4px);
    }

    .btn:hover{
      transform: translateY(-6px);
      filter:brightness(1.12);
      box-shadow: 0 18px 40px rgba(0,0,0,0.6);
    }

    /* Responsive adjustments */
    @media (max-width:1400px){
      .corner-art{width:68vw; min-width:360px}
    }

    @media (max-width:1100px){
      .corner-art{width:78vw; min-width:320px}
      .main-wrapper{padding-bottom:160px}
    }

    @media (max-width:820px){
      .corner-art{width:100vw; left:0; bottom:0; opacity:0.85}
      .main-wrapper{z-index:6}
    }

    @media (max-width:520px){
      .corner-art{display:none} /* hide on very small screens to avoid overlap */
      h1.headline{font-size:2.4rem}
      .description{font-size:16px}
      .btn-container{flex-direction:column;gap:12px}
      .logo-container img{height:44px}
      .main-wrapper{padding-bottom:140px}
    }

    .btn:focus{outline:3px solid rgba(255,255,255,0.12);outline-offset:3px}
  </style>
</head>
<body>

  <div class="bg" aria-hidden="true"></div>

  <div class="logo-container" aria-hidden="false">
    <img
      src="https://rlsh1855.github.io/3Js-and-RLSH-Website/RLSH_METAL_LOGO-Photoroom.png"
      alt="RLSH Logo"
      onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%2252%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%23010411%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23fff%22 font-family=%22Segoe UI%22 font-size=%2212%22>RLSH</text></svg>';"
    />
    <img
      src="https://rlsh1855.github.io/3Js-and-RLSH-Website/3js-logo-white.png"
      alt="3J's Auto Body Logo"
      onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%2252%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%23010411%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23fff%22 font-family=%22Segoe UI%22 font-size=%2212%22>3Js</text></svg>';"
    />
  </div>

  <main class="main-wrapper" role="main" aria-labelledby="headline">
    <div class="status-badge" aria-hidden="false">Phase: In Progress</div>

    <h1 id="headline" class="headline" data-text="RETOOLING THE SHOP">RETOOLING THE SHOP</h1>

    <p class="description">
      We are fine-tuning this page to bring you a better<br />
      digital experience. Our collision and protection
    </p>

    <div class="master-data-row" role="list" aria-label="Services">
      <span role="listitem">Precision Painting</span>
      <span role="listitem">Expert Bodywork</span>
      <span role="listitem">Rhino Linings</span>
      <span role="listitem">Frame Alignment</span>
    </div>
  </main>

  <div class="console-art" aria-hidden="true"></div>

  <!-- Large bottom-left decorative image scaled up toward the middle -->
  <img
    class="corner-art"
    src="https://rlsh1855.github.io/3Js-and-RLSH-Website/gears%20and%20motherboard%20lines%20overy%20for%20background.png"
    alt=""
    onerror="this.style.display='none';"
    aria-hidden="true"
  />

  <div class="bottom-console" aria-hidden="false">
    <div class="btn-container" role="navigation" aria-label="Site links">
      <a
        class="btn btn-home"
        href="https://www.3jsautobody.com/"
        target="_blank"
        rel="noopener noreferrer"
        >Back to Homepage</a
      >
      <a
        class="btn btn-quote"
        href="https://www.3jsautobody.com/request-a-quote"
        target="_blank"
        rel="noopener noreferrer"
        >Request Quote</a
      >
    </div>
  </div>

  <script>
    (function(){
      var h = document.querySelector('h1.headline');
      if(h && !h.getAttribute('data-text')) h.setAttribute('data-text', h.textContent.trim());
    })();
  </script>
</body>
</html>
