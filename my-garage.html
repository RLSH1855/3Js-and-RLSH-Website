<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Garage — 3J's Auto Body</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;overflow:hidden;background:#080808;}

    /* ── POPUP (fills lightbox iframe) ── */
    .popup{
      width:100%;height:100vh;
      display:flex;position:relative;overflow:hidden;
      border:1px solid #2a2a2a;
      box-shadow:0 32px 80px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.04);
    }

    /* ── CLOSE BTN ── */
    .close-btn{
      position:absolute;top:14px;right:16px;
      background:none;border:none;
      color:rgba(255,255,255,0.35);font-size:16px;
      cursor:pointer;z-index:20;padding:4px 8px;
      transition:color 0.2s;line-height:1;
      font-family:'Montserrat',sans-serif;font-weight:300;
    }
    .close-btn:hover{color:#fff;}

    /* ── LEFT PANEL: persistent image ── */
    .image-panel{
      width:50%;flex-shrink:0;
      position:relative;overflow:hidden;
    }
    .image-panel img{
      width:100%;height:100%;
      object-fit:cover;object-position:center;
      display:block;
    }
    .image-panel-overlay{
      position:absolute;inset:0;
      background:rgba(0,0,0,0.15);
    }

    /* ── RIGHT PANEL ── */
    .content-panel{
      flex:1;background:#080808;
      position:relative;
      overflow:hidden;
    }

    /* Form content wrapper — centers content at 350px within right panel */
    .form-wrap{
      width:350px;max-width:100%;margin:0 auto;
      display:flex;flex-direction:column;flex:1;
    }

    /* ── SCREENS ── */
    .screen{
      position:absolute;inset:0;
      padding:28px 28px 24px;
      display:flex;flex-direction:column;
      transform:translateX(100%);
      opacity:0;
      transition:transform 0.38s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease;
      pointer-events:none;
      overflow-y:auto;
    }
    .screen.visible{
      transform:translateX(0);opacity:1;pointer-events:all;
    }
    .screen.exit-left{
      transform:translateX(-26%);opacity:0;pointer-events:none;
    }
    .screen.exit-right{
      transform:translateX(100%);opacity:0;pointer-events:none;
    }

    /* ── STEP INDICATOR ── */
    .step-pill{
      display:inline-flex;align-items:center;gap:6px;
      margin-bottom:16px;
    }
    .step-dot{
      width:6px;height:6px;background:#8B0000;
    }
    .step-text{
      font-family:'Montserrat',sans-serif;font-size:9px;font-weight:700;
      letter-spacing:2.5px;text-transform:uppercase;color:#555;
    }
    .step-text span{color:#888;}

    /* ── SCREEN 1 ── */
    .s1-heading{
      font-family:'Montserrat',sans-serif;font-size:clamp(22px,2.6vw,32px);
      font-weight:900;letter-spacing:-0.5px;text-transform:uppercase;
      color:#fff;line-height:1.35;margin-bottom:20px;
    }
    .s1-heading em{font-style:normal;color:#8B0000;}

    /* Custom pickers shared */
    .picker-field{margin-bottom:10px;}
    .picker-label{
      font-family:'Montserrat',sans-serif;font-size:9px;font-weight:700;
      letter-spacing:2px;text-transform:uppercase;color:#555;
      display:block;margin-bottom:5px;
    }
    .picker-wrap{position:relative;}

    /* Picker button */
    .picker-btn{
      width:100%;padding:10px 12px;
      background:#111;border:1px solid #2a2a2a;
      font-family:'Montserrat',sans-serif;font-size:14px;font-weight:700;
      color:#fff;letter-spacing:1.5px;
      display:flex;align-items:center;justify-content:space-between;gap:8px;
      cursor:pointer;text-align:left;min-height:42px;
      transition:border-color 0.2s;
    }
    .picker-btn:hover{border-color:#444;}
    .picker-btn.open{border-color:#8B0000;}
    .picker-btn .ph{color:#3a3a3a;font-weight:600;}
    .picker-btn.disabled-state{opacity:0.35;cursor:not-allowed;pointer-events:none;}
    .picker-arrow{font-size:9px;color:#8B0000;transition:transform 0.2s;flex-shrink:0;}
    .picker-btn.open .picker-arrow{transform:rotate(180deg);}

    /* Picker dropdown panel */
    .picker-panel{
      display:none;
      position:absolute;top:calc(100% + 4px);left:0;right:0;
      background:#111;border:1px solid #2a2a2a;
      box-shadow:0 12px 40px rgba(0,0,0,0.7);
      z-index:200;padding:8px;
      max-height:220px;overflow-y:auto;
    }
    .picker-panel.open{display:block;}

    /* Year grid */
    .year-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;}
    .picker-cell{
      padding:7px 4px;text-align:center;
      font-family:'Montserrat',sans-serif;font-size:13px;font-weight:700;
      color:#ccc;cursor:pointer;letter-spacing:1px;
      transition:background 0.12s,color 0.12s;
    }
    .picker-cell:hover{background:#8B0000;color:#fff;}
    .picker-cell.selected{background:#8B0000;color:#fff;}

    /* Make grid (2 col) */
    .make-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px;}

    /* Model list (1 col) */
    .model-list{display:grid;grid-template-columns:1fr;gap:2px;}
    .model-cell{
      padding:9px 12px;
      font-family:'Montserrat',sans-serif;font-size:13px;font-weight:700;
      color:#ccc;cursor:pointer;letter-spacing:1px;
      transition:background 0.12s,color 0.12s;
    }
    .model-cell:hover{background:#8B0000;color:#fff;}
    .model-cell.selected{background:#8B0000;color:#fff;}

    /* Next btn */
    .next-btn{
      margin-top:auto;
      width:100%;height:48px;
      background:#8B0000;color:#fff;border:2px solid #8B0000;
      font-family:'Montserrat',sans-serif;font-size:11px;font-weight:800;
      letter-spacing:2px;text-transform:uppercase;cursor:pointer;
      transition:background 0.2s,color 0.2s,border-color 0.2s,opacity 0.2s;
      opacity:0.3;pointer-events:none;
    }
    .next-btn.ready{opacity:1;pointer-events:all;}
    .next-btn:hover{background:#fff;color:#8B0000;border-color:#fff;}

    /* ── SCREEN 2 ── */
    .back-btn{
      display:inline-flex;align-items:center;gap:6px;
      padding:0 14px;height:30px;width:fit-content;margin-bottom:14px;
      background:#111;border:1px solid #333;
      font-family:'Montserrat',sans-serif;font-size:9px;font-weight:700;
      letter-spacing:2px;text-transform:uppercase;color:#777;
      cursor:pointer;transition:background 0.2s,border-color 0.2s,color 0.2s;
    }
    .back-btn:hover{background:#1e1e1e;border-color:#555;color:#ccc;}

    .confirm-label{
      font-family:'Montserrat',sans-serif;font-size:9px;font-weight:700;
      letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:4px;
    }
    .confirm-vehicle{
      font-family:'Montserrat',sans-serif;font-size:17px;font-weight:900;
      text-transform:uppercase;letter-spacing:0.5px;color:#fff;
      margin-bottom:24px;padding-bottom:16px;
      border-bottom:1px solid #1e1e1e;line-height:1.2;
    }

    .s2-field{margin-bottom:18px;}
    .s2-label{
      font-family:'Montserrat',sans-serif;font-size:9px;font-weight:700;
      letter-spacing:2px;text-transform:uppercase;color:#555;
      display:block;margin-bottom:5px;
    }

    /* Color row */
    .color-row{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
    .color-row-label{
      font-family:'Montserrat',sans-serif;font-size:9px;font-weight:700;
      letter-spacing:2px;text-transform:uppercase;color:#555;white-space:nowrap;
    }
    .swatches{display:flex;gap:6px;flex-wrap:wrap;}
    .swatch{
      width:20px;height:20px;border-radius:50%;
      border:2px solid transparent;cursor:pointer;flex-shrink:0;
      transition:transform 0.15s,border-color 0.15s;
    }
    .swatch:hover{transform:scale(1.2);}
    .swatch.selected{border-color:#8B0000;transform:scale(1.2);}

    .save-btn{
      margin-top:auto;
      width:100%;height:48px;
      background:#8B0000;color:#fff;border:2px solid #8B0000;
      font-family:'Montserrat',sans-serif;font-size:11px;font-weight:800;
      letter-spacing:2px;text-transform:uppercase;cursor:pointer;
      transition:background 0.2s,color 0.2s,border-color 0.2s;
    }
    .save-btn:hover{background:#fff;color:#8B0000;border-color:#fff;}

    /* ── SCREEN 3 ── */
    .screen-3-inner{
      display:flex;flex-direction:column;
      align-items:center;justify-content:flex-start;
      text-align:center;gap:22px;flex:1;
      padding-top:44px;
    }
    .s3-check{
      width:44px;height:44px;background:#8B0000;
      display:flex;align-items:center;justify-content:center;
      font-size:20px;color:#fff;margin-bottom:4px;
    }
    .s3-title{
      font-family:'Montserrat',sans-serif;font-size:18px;font-weight:900;
      text-transform:uppercase;letter-spacing:1px;color:#fff;
    }
    .s3-sub{
      font-family:'Inter',sans-serif;font-size:12px;color:#555;
      font-weight:400;
    }
    .s3-vehicle{
      font-family:'Montserrat',sans-serif;font-weight:900;
      font-size:clamp(13px,2vw,17px);
      letter-spacing:1px;
      color:#fff;line-height:1.3;
    }
    .s3-vehicle .year-tag{color:#8B0000;}

    .s3-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
    .s3-btn-primary{
      padding:12px 20px;
      background:#8B0000;color:#fff;border:2px solid #8B0000;
      font-family:'Montserrat',sans-serif;font-size:10px;font-weight:800;
      letter-spacing:2px;text-transform:uppercase;cursor:pointer;
      transition:background 0.2s,color 0.2s,border-color 0.2s;
    }
    .s3-btn-primary:hover{background:#fff;color:#8B0000;border-color:#fff;}
    .s3-btn-secondary{
      padding:12px 20px;
      background:transparent;color:#888;
      border:1px solid #2a2a2a;
      font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;
      letter-spacing:2px;text-transform:uppercase;cursor:pointer;
      transition:all 0.2s;
    }
    .s3-btn-secondary:hover{border-color:#666;color:#fff;}

    .s3-close{
      margin-top:auto;align-self:center;
      display:inline-flex;align-items:center;justify-content:center;
      padding:0 14px;height:30px;width:fit-content;
      background:#111;border:1px solid #333;
      font-family:'Montserrat',sans-serif;font-size:9px;font-weight:700;
      letter-spacing:2px;text-transform:uppercase;color:#777;
      cursor:pointer;transition:background 0.2s,border-color 0.2s,color 0.2s;
      text-decoration:none;
    }
    .s3-close:hover{background:#1e1e1e;border-color:#555;color:#ccc;}

    /* Scrollbar */
    .picker-panel::-webkit-scrollbar{width:4px;}
    .picker-panel::-webkit-scrollbar-track{background:#0d0d0d;}
    .picker-panel::-webkit-scrollbar-thumb{background:#2a2a2a;}
    .screen::-webkit-scrollbar{width:4px;}
    .screen::-webkit-scrollbar-track{background:#080808;}
    .screen::-webkit-scrollbar-thumb{background:#1e1e1e;}

    /* ── MOBILE ── */
    @media(max-width:640px){
      .image-panel{display:none!important;}
      .content-panel{width:100%!important;}
      .screen{padding:20px 20px 18px;}
      .form-wrap{width:100%;}
      .s1-heading{font-size:22px;margin-bottom:16px;}
      .picker-btn{font-size:13px;min-height:44px;}
      .next-btn,.save-btn{height:48px;}
      .screen-3-inner{padding-top:32px;gap:16px;}
      .s3-actions{flex-direction:column;align-items:stretch;}
      .s3-btn-primary,.s3-btn-secondary{width:100%;text-align:center;}
      .confirm-vehicle{font-size:15px;}
    }
    body.mobile .image-panel{display:none!important;}
    body.mobile .content-panel{width:100%!important;}
    body.mobile .screen{padding:20px 20px 18px;}
    body.mobile .form-wrap{width:100%;}
    body.mobile .s1-heading{font-size:22px;margin-bottom:16px;}
    body.mobile .picker-btn{font-size:13px;min-height:44px;}
    body.mobile .next-btn,body.mobile .save-btn{height:48px;}
    body.mobile .screen-3-inner{padding-top:32px;gap:16px;}
    body.mobile .s3-actions{flex-direction:column;align-items:stretch;}
    body.mobile .s3-btn-primary,body.mobile .s3-btn-secondary{width:100%;text-align:center;}
    body.mobile .confirm-vehicle{font-size:15px;}
  </style>
</head>
<body>

<div class="popup" id="popup">

  <!-- Close -->
  <button class="close-btn" onclick="closeGarage()">✕</button>

  <!-- LEFT: persistent image -->
  <div class="image-panel">
    <img src="https://rlsh1855.github.io/3Js-and-RLSH-Website/images/trucks/garage-hero-raptor.png" alt="Truck"/>
    <div class="image-panel-overlay"></div>
  </div>

  <!-- RIGHT: screens -->
  <div class="content-panel" id="content-panel">

    <!-- SCREEN 1 -->
    <div class="screen visible" id="screen-1">
      <div class="step-pill">
        <div class="step-dot"></div>
        <span class="step-text">Step <span>1 of 2</span> — Select Vehicle</span>
      </div>
      <div class="form-wrap">
      <h2 class="s1-heading">Find Parts That<br><em>Fit</em> Your Truck</h2>

      <!-- Year picker -->
      <div class="picker-field">
        <span class="picker-label">Year</span>
        <div class="picker-wrap" id="year-wrap">
          <button type="button" class="picker-btn" id="year-btn" onclick="togglePicker('year')">
            <span id="year-label" class="ph">Select Year</span>
            <span class="picker-arrow">▼</span>
          </button>
          <div class="picker-panel" id="year-panel">
            <div class="year-grid" id="year-grid"></div>
          </div>
        </div>
        <input type="hidden" id="val-year"/>
      </div>

      <!-- Make picker -->
      <div class="picker-field">
        <span class="picker-label">Make</span>
        <div class="picker-wrap" id="make-wrap">
          <button type="button" class="picker-btn disabled-state" id="make-btn" onclick="togglePicker('make')">
            <span id="make-label" class="ph">Select Make</span>
            <span class="picker-arrow">▼</span>
          </button>
          <div class="picker-panel" id="make-panel">
            <div class="make-grid" id="make-grid"></div>
          </div>
        </div>
        <input type="hidden" id="val-make"/>
      </div>

      <!-- Model picker -->
      <div class="picker-field">
        <span class="picker-label">Model</span>
        <div class="picker-wrap" id="model-wrap">
          <button type="button" class="picker-btn disabled-state" id="model-btn" onclick="togglePicker('model')">
            <span id="model-label" class="ph">Select Model</span>
            <span class="picker-arrow">▼</span>
          </button>
          <div class="picker-panel" id="model-panel">
            <div class="model-list" id="model-grid"></div>
          </div>
        </div>
        <input type="hidden" id="val-model"/>
      </div>

      <button class="next-btn" id="next-btn" onclick="goStep2()">Next — Confirm Details →</button>
      </div><!-- /form-wrap -->
    </div>

    <!-- SCREEN 2 -->
    <div class="screen" id="screen-2">
      <div class="step-pill">
        <div class="step-dot"></div>
        <span class="step-text">Step <span>2 of 2</span> — Confirm Details</span>
      </div>
      <button class="back-btn" onclick="goBack()">← Back</button>
      <div class="form-wrap">
      <div class="confirm-label">Your Vehicle</div>
      <div class="confirm-vehicle" id="confirm-name">—</div>

      <div class="s2-field" id="trim-field">
        <span class="s2-label">Trim Level</span>
        <div class="picker-wrap" id="trim-wrap">
          <button type="button" class="picker-btn" id="trim-btn" onclick="togglePicker('trim')">
            <span id="trim-label" class="ph">Unknown / Not Listed</span>
            <span class="picker-arrow">▼</span>
          </button>
          <div class="picker-panel" id="trim-panel">
            <div class="model-list" id="trim-grid"></div>
          </div>
        </div>
        <input type="hidden" id="val-trim"/>
      </div>

      <div class="s2-field" id="bed-field" style="display:none;">
        <span class="s2-label">Bed Size</span>
        <div class="picker-wrap" id="bed-wrap">
          <button type="button" class="picker-btn" id="bed-btn" onclick="togglePicker('bed')">
            <span id="bed-label" class="ph">Select Bed Size</span>
            <span class="picker-arrow">▼</span>
          </button>
          <div class="picker-panel" id="bed-panel">
            <div class="model-list" id="bed-grid"></div>
          </div>
        </div>
        <input type="hidden" id="val-bed"/>
      </div>

      <div class="color-row">
        <span class="color-row-label">Color</span>
        <div class="swatches" id="swatches"></div>
      </div>

      <button class="save-btn" onclick="saveVehicle()">✓ Save to My Garage</button>
      </div><!-- /form-wrap -->
    </div>

    <!-- SCREEN 3 -->
    <div class="screen" id="screen-3">
      <button class="back-btn" onclick="transitionTo('screen-2','back')">← Back</button>
      <div class="screen-3-inner">
        <div class="s3-check">✓</div>
        <div class="s3-title">Garage Locked In</div>
        <div class="s3-sub">Parts that fit your truck — across every page.</div>
        <div class="s3-vehicle" id="s3-vehicle">—</div>
        <div class="s3-actions">
          <button class="s3-btn-primary" onclick="browseAccessories()">Browse Accessories</button>
          <button class="s3-btn-secondary" onclick="resetAll()">Change Vehicle</button>
        </div>
      </div>
      <button class="s3-close" onclick="closeGarage()">Close</button>
    </div>

  </div><!-- /content-panel -->
</div><!-- /popup -->

<script>
var MAKES={
  "Ford":     ["F-150","F-150 Lightning","Super Duty F-250/F-350","Ranger","Maverick"],
  "Chevrolet":["Silverado 1500","Silverado 2500HD/3500HD","Colorado"],
  "GMC":      ["Sierra 1500","Sierra 2500HD/3500HD","Canyon"],
  "RAM":      ["1500","1500 TRX","1500 RHO","2500/3500"],
  "Toyota":   ["Tacoma","Tundra","Pickup","T100"],
  "Nissan":   ["Titan","Titan XD","Frontier"],
  "Honda":    ["Ridgeline"],
  "Jeep":     ["Gladiator"],
};

var TRIMS={
  "F-150":          ["XL","XLT","Lariat","King Ranch","Platinum","Limited","Raptor","Raptor R"],
  "Silverado 1500": ["WT","Custom","LT","RST","LTZ","High Country","ZR2","Trail Boss"],
  "Sierra 1500":    ["Pro","SLE","SLT","AT4","Denali","Denali Ultimate"],
  "1500":           ["Tradesman","Big Horn","Lone Star","Laramie","Rebel","Limited","Longhorn"],
  "Tacoma":         ["SR","SR5","TRD Sport","TRD Off-Road","Limited","TRD Pro","Trailhunter"],
  "Tundra":         ["SR","SR5","Limited","Platinum","1794 Edition","TRD Pro","Capstone"],
  "Ranger":         ["XL","XLT","Lariat","Raptor"],
  "Colorado":       ["WT","LT","Z71","ZR2","Trail Boss"],
  "Canyon":         ["Pro","SLE","Elevation","SLT","AT4X","Denali"],
  "Gladiator":      ["Sport","Sport S","Willys","Rubicon","Mojave"],
};

var BED_SIZES={
  "F-150":                 [["5'6\" Short",66],["6'6\" Standard",78]],
  "Super Duty F-250/F-350":[["6'9\" Standard",81],["8' Long",96]],
  "Silverado 1500":        [["5'9\" Short",69],["6'7\" Standard",79]],
  "Sierra 1500":           [["5'9\" Short",69],["6'7\" Standard",79]],
  "1500":                  [["5'7\" Short",67],["6'4\" Standard",76],["8' Long",96]],
  "Tacoma":                [["5' Short",60],["6' Standard",72]],
  "Tundra":                [["5'6\" Short",66],["6'6\" Standard",78],["8' Long",96]],
  "Ranger":                [["5' Short",60],["6' Standard",72]],
  "Colorado":              [["5'2\" Short",62],["6'7\" Standard",79]],
  "Canyon":                [["5'2\" Short",62],["6'7\" Standard",79]],
  "Frontier":              [["5' Short",60],["6' Standard",72]],
};

var COLORS=[
  {name:"White",hex:"#F5F5F0"},{name:"Silver",hex:"#C0C0C0"},{name:"Gray",hex:"#808080"},
  {name:"Black",hex:"#1a1a1a"},{name:"Red",hex:"#B22222"},{name:"Blue",hex:"#1E3A8A"},
  {name:"Navy",hex:"#0a1628"},{name:"Green",hex:"#2D5016"},{name:"Brown",hex:"#6B3A2A"},
  {name:"Orange",hex:"#CC5500"},{name:"Yellow",hex:"#D4A017"},
];

var selectedColor=COLORS[0];
var pendingVehicle={};
var currentVehicle=null;

(function(){
  function checkMobile(){
    if(window.innerWidth<=640||document.documentElement.clientWidth<=640){
      document.body.classList.add('mobile');
    } else {
      document.body.classList.remove('mobile');
    }
  }
  checkMobile();
  window.addEventListener('resize',checkMobile);
})();

// Build year grid
(function(){
  var grid=document.getElementById('year-grid');
  for(var y=2026;y>=1981;y--){
    (function(yr){
      var c=document.createElement('div');
      c.className='picker-cell';
      c.textContent=yr;
      c.onclick=function(){
        document.getElementById('val-year').value=yr;
        document.getElementById('year-label').textContent=yr;
        document.getElementById('year-label').classList.remove('ph');
        grid.querySelectorAll('.picker-cell').forEach(function(x){x.classList.remove('selected');});
        c.classList.add('selected');
        closePicker('year');
        onYearPicked();
      };
      grid.appendChild(c);
    })(y);
  }
})();

function onYearPicked(){
  document.getElementById('val-make').value='';
  document.getElementById('make-label').textContent='Select Make';
  document.getElementById('make-label').classList.add('ph');
  document.getElementById('make-btn').classList.remove('disabled-state');
  document.querySelectorAll('#make-grid .picker-cell').forEach(function(c){c.classList.remove('selected');});
  document.getElementById('val-model').value='';
  document.getElementById('model-label').textContent='Select Model';
  document.getElementById('model-label').classList.add('ph');
  document.getElementById('model-btn').classList.add('disabled-state');

  var g=document.getElementById('make-grid');
  g.innerHTML='';
  Object.keys(MAKES).forEach(function(m){
    var c=document.createElement('div');
    c.className='picker-cell';
    c.textContent=m;
    c.onclick=function(){
      document.getElementById('val-make').value=m;
      document.getElementById('make-label').textContent=m;
      document.getElementById('make-label').classList.remove('ph');
      g.querySelectorAll('.picker-cell').forEach(function(x){x.classList.remove('selected');});
      c.classList.add('selected');
      closePicker('make');
      onMakePicked(m);
    };
    g.appendChild(c);
  });
  checkReady();
}

function onMakePicked(make){
  document.getElementById('val-model').value='';
  document.getElementById('model-label').textContent='Select Model';
  document.getElementById('model-label').classList.add('ph');
  document.getElementById('model-btn').classList.remove('disabled-state');

  var g=document.getElementById('model-grid');
  g.innerHTML='';
  (MAKES[make]||[]).forEach(function(m){
    var c=document.createElement('div');
    c.className='model-cell';
    c.textContent=m;
    c.onclick=function(){
      document.getElementById('val-model').value=m;
      document.getElementById('model-label').textContent=m;
      document.getElementById('model-label').classList.remove('ph');
      g.querySelectorAll('.model-cell').forEach(function(x){x.classList.remove('selected');});
      c.classList.add('selected');
      closePicker('model');
      checkReady();
    };
    g.appendChild(c);
  });
  checkReady();
}

function checkReady(){
  var y=document.getElementById('val-year').value;
  var mk=document.getElementById('val-make').value;
  var mo=document.getElementById('val-model').value;
  document.getElementById('next-btn').classList.toggle('ready',!!(y&&mk&&mo));
}

function togglePicker(name){
  var btn=document.getElementById(name+'-btn');
  var panel=document.getElementById(name+'-panel');
  var isOpen=panel.classList.contains('open');
  ['year','make','model','trim','bed'].forEach(function(n){
    var p=document.getElementById(n+'-panel');
    var b=document.getElementById(n+'-btn');
    if(p) p.classList.remove('open');
    if(b) b.classList.remove('open');
  });
  if(!isOpen){
    panel.classList.add('open');
    btn.classList.add('open');
  }
}
function closePicker(name){
  var p=document.getElementById(name+'-panel');
  var b=document.getElementById(name+'-btn');
  if(p) p.classList.remove('open');
  if(b) b.classList.remove('open');
}

document.addEventListener('click',function(e){
  ['year','make','model','trim','bed'].forEach(function(n){
    var wrap=document.getElementById(n+'-wrap');
    if(wrap&&!wrap.contains(e.target)) closePicker(n);
  });
});

function goStep2(){
  var year=document.getElementById('val-year').value;
  var make=document.getElementById('val-make').value;
  var model=document.getElementById('val-model').value;
  if(!year||!make||!model) return;
  pendingVehicle={year:year,make:make,model:model};
  document.getElementById('confirm-name').textContent=year+' '+make+' '+model;

  var trims=TRIMS[model]||[];
  var trimGrid=document.getElementById('trim-grid');
  var trimBtn=document.getElementById('trim-btn');
  var trimLabel=document.getElementById('trim-label');
  document.getElementById('val-trim').value='';
  trimLabel.textContent='Unknown / Not Listed';
  trimLabel.classList.add('ph');
  trimGrid.innerHTML='';
  if(trims.length){
    trimBtn.classList.remove('disabled-state');
    var unknown=document.createElement('div');
    unknown.className='model-cell';
    unknown.textContent='Unknown / Not Listed';
    unknown.onclick=function(){
      document.getElementById('val-trim').value='';
      trimLabel.textContent='Unknown / Not Listed';
      trimLabel.classList.add('ph');
      trimGrid.querySelectorAll('.model-cell').forEach(function(x){x.classList.remove('selected');});
      unknown.classList.add('selected');
      closePicker('trim');
    };
    trimGrid.appendChild(unknown);
    trims.forEach(function(t){
      var c=document.createElement('div');
      c.className='model-cell';
      c.textContent=t;
      c.onclick=function(){
        document.getElementById('val-trim').value=t;
        trimLabel.textContent=t;
        trimLabel.classList.remove('ph');
        trimGrid.querySelectorAll('.model-cell').forEach(function(x){x.classList.remove('selected');});
        c.classList.add('selected');
        closePicker('trim');
      };
      trimGrid.appendChild(c);
    });
  } else {
    trimBtn.classList.add('disabled-state');
    trimLabel.textContent='No trim data';
  }
  document.getElementById('trim-field').style.display='block';

  var beds=BED_SIZES[model]||[];
  var bedGrid=document.getElementById('bed-grid');
  var bedBtn=document.getElementById('bed-btn');
  var bedLabel=document.getElementById('bed-label');
  document.getElementById('val-bed').value='';
  bedLabel.textContent='Select Bed Size';
  bedLabel.classList.add('ph');
  bedGrid.innerHTML='';
  if(beds.length){
    beds.forEach(function(b){
      var c=document.createElement('div');
      c.className='model-cell';
      c.textContent=b[0];
      c.onclick=function(){
        document.getElementById('val-bed').value=b[1];
        bedLabel.textContent=b[0];
        bedLabel.classList.remove('ph');
        bedGrid.querySelectorAll('.model-cell').forEach(function(x){x.classList.remove('selected');});
        c.classList.add('selected');
        closePicker('bed');
      };
      bedGrid.appendChild(c);
    });
    if(beds.length===1) bedGrid.firstChild.click();
    document.getElementById('bed-field').style.display='block';
  } else {
    document.getElementById('bed-field').style.display='none';
  }

  buildSwatches();
  transitionTo('screen-2','forward');
}

function goBack(){ transitionTo('screen-1','back'); }

function buildSwatches(){
  var wrap=document.getElementById('swatches');
  wrap.innerHTML='';
  COLORS.forEach(function(c){
    var s=document.createElement('div');
    s.className='swatch'+(c.name===selectedColor.name?' selected':'');
    s.style.background=c.hex;
    if(c.name==='White') s.style.border='2px solid #444';
    s.title=c.name;
    s.onclick=function(){selectedColor=c;buildSwatches();};
    wrap.appendChild(s);
  });
}

function saveVehicle(){
  var trim=document.getElementById('val-trim').value;
  var bedVal=document.getElementById('val-bed').value;
  var beds=BED_SIZES[pendingVehicle.model]||[];
  var bedLabel='';
  if(bedVal){
    var match=beds.find(function(b){return b[1]==bedVal;});
    bedLabel=match?match[0]:'';
  }

  var yr=String(pendingVehicle.year).slice(2);
  var yTag="'"+yr;
  var make=pendingVehicle.make;
  var model=pendingVehicle.model;
  var trimStr=trim&&trim!==''?' — '+trim:'';
  var bedStr=bedLabel?' · '+bedLabel:'';

  document.getElementById('s3-vehicle').innerHTML=
    '<span class="year-tag">'+yTag+'</span> '+make+' '+model+trimStr+bedStr;

  var vehicleLabel=yTag+' '+make+' '+model+(trim?' — '+trim:'');
  currentVehicle={
    year:pendingVehicle.year,
    make:make,
    model:model,
    trim:trim||'',
    bedSize:bedLabel||'',
    color:selectedColor.name,
    label:vehicleLabel
  };
  try{ localStorage.setItem('garage_vehicle',JSON.stringify(currentVehicle)); }catch(e){}

  transitionTo('screen-3','forward');
}

function resetAll(){
  ['year','make','model'].forEach(function(n){
    document.getElementById('val-'+n).value='';
    document.getElementById(n+'-label').textContent='Select '+(n.charAt(0).toUpperCase()+n.slice(1));
    document.getElementById(n+'-label').classList.add('ph');
    closePicker(n);
  });
  document.getElementById('make-btn').classList.add('disabled-state');
  document.getElementById('model-btn').classList.add('disabled-state');
  document.getElementById('year-grid').querySelectorAll('.picker-cell').forEach(function(c){c.classList.remove('selected');});
  document.getElementById('next-btn').classList.remove('ready');

  var screens=document.querySelectorAll('.screen');
  screens.forEach(function(s){
    s.classList.remove('visible','exit-left','exit-right');
    s.style.cssText='';
  });
  document.getElementById('screen-1').classList.add('visible');
}

function transitionTo(newId,dir){
  var current=document.querySelector('.screen.visible');
  var next=document.getElementById(newId);
  if(current){
    current.classList.remove('visible');
    current.classList.add(dir==='forward'?'exit-left':'exit-right');
    setTimeout(function(){current.classList.remove('exit-left','exit-right');},420);
  }
  next.style.transition='none';
  next.style.transform=dir==='forward'?'translateX(100%)':'translateX(-26%)';
  next.style.opacity='0';
  next.offsetHeight;
  next.style.transition='';
  next.style.transform='';
  next.style.opacity='';
  next.classList.add('visible');
}

function closeGarage(){
  if(currentVehicle){
    window.parent.postMessage({type:'garage_saved',vehicle:currentVehicle},'*');
  } else {
    window.parent.postMessage({type:'close_garage'},'*');
  }
}

function loadSavedVehicle(v){
  currentVehicle = v;
  var yr=String(v.year).slice(2);
  var yTag="'"+yr;
  var trimStr=v.trim&&v.trim!==''?' — '+v.trim:'';
  var bedStr=v.bedSize?' · '+v.bedSize:'';
  document.getElementById('s3-vehicle').innerHTML=
    '<span class="year-tag">'+yTag+'</span> '+v.make+' '+v.model+trimStr+bedStr;
  document.querySelectorAll('.screen').forEach(function(s){
    s.classList.remove('visible','exit-left','exit-right');
    s.style.cssText='';
  });
  var s3=document.getElementById('screen-3');
  s3.style.transition='none';
  s3.classList.add('visible');
}

var vehicleLoaded=false;
var readyTimer=null;

window.addEventListener('message',function(event){
  if(!event.data||!event.data.type) return;
  if(event.data.type==='load_vehicle'&&event.data.vehicle){
    vehicleLoaded=true;
    if(readyTimer){clearInterval(readyTimer);readyTimer=null;}
    loadSavedVehicle(event.data.vehicle);
  }
});

window.addEventListener('load',function(){
  window.parent.postMessage({type:'garage_ready'},'*');
  readyTimer=setInterval(function(){
    if(!vehicleLoaded) window.parent.postMessage({type:'garage_ready'},'*');
  },300);
  setTimeout(function(){if(readyTimer){clearInterval(readyTimer);readyTimer=null;}},4000);
});

function browseAccessories(){
  window.parent.postMessage({type:'browse_accessories',vehicle:currentVehicle||null},'*');
}
</script>
</body>
</html>
