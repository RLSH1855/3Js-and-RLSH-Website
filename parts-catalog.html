<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tonneau Covers — RLSH Truck &amp; Jeep Outfitters · Signal Hill, CA</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#ffffff; --surface:#ffffff; --surface2:#f4f4f1;
    --border:rgba(20,18,14,.08); --border-strong:rgba(20,18,14,.18);
    --fg:#1a1815; --fg-muted:rgba(26,24,21,.62); --fg-dim:rgba(26,24,21,.42);
    --accent:#8B0000; --gap:18px; --pad:18px; --cols:3;
    --display:'Barlow Condensed', Impact, sans-serif;
    --body:'Inter', system-ui, sans-serif;
    --mono:'JetBrains Mono', ui-monospace, monospace;
  }
  *,*::before,*::after { box-sizing: border-box; }
  html,body { margin:0; padding:0; overflow-x:hidden; }
  body { font-family: var(--body); background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  svg { display:inline-block; vertical-align: middle; }
  ::selection { background: var(--accent); color:#fff; }

  .app { background: var(--bg); color: var(--fg); }

  /* ── Buttons ── */
  .btn-primary { background: var(--accent); color:#fff; border:0; padding: 12px 18px; font-family: var(--display); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; cursor: pointer; transition: filter .15s, transform .1s; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-ghost { background: transparent; color: var(--fg); border: 1px solid var(--border-strong); padding: 12px 18px; font-family: var(--display); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; cursor: pointer; }
  .btn-ghost:hover { background: rgba(255,255,255,.04); }
  .icon-btn { background:transparent; border:0; color: var(--fg); width:40px; height:40px; cursor:pointer; position:relative; display:inline-flex; align-items:center; justify-content:center; border-radius: 4px; }
  .icon-btn:hover { background: rgba(255,255,255,.05); }
  .icon-btn svg { width: 20px; height: 20px; }
  .cart-dot { position:absolute; top:6px; right:4px; background: var(--accent); color:#fff; font-size: 10px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 8px; display:flex; align-items:center; justify-content:center; padding: 0 4px; }

  /* ── Header ── */
  .hdr { position: sticky; top: 0; z-index: 50; background: rgba(10,10,12,.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
  .hdr-promo { background: #000; color: #fff; font-size: 12px; height: 34px; overflow: hidden; display:flex; align-items:center; mask-image: linear-gradient(to right, transparent 0%, #000 10%, #000 90%, transparent 100%); -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 10%, #000 90%, transparent 100%); }
  .hdr-promo .bolt { color: var(--accent); display:inline-flex; }
  .hdr-promo .bolt svg { width: 14px; height: 14px; }
  .hdr-ticker { display:flex; white-space:nowrap; animation: ticker-scroll 38s linear infinite; }
  .hdr-ticker-item { display:inline-flex; align-items:center; gap: 8px; padding: 0 60px; }
  @keyframes ticker-scroll { 0% { transform:translateX(0); } 100% { transform:translateX(-50%); } }

  .hdr-main { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; padding: 12px 24px; }
  .logo { display:flex; align-items:center; gap: 10px; }
  .logo img { height: 60px; display:block; }

  .search { display:flex; align-items:center; gap: 8px; max-width: 680px; width: 100%; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); padding: 0 14px; height: 42px; }
  .search:focus-within { border-color: var(--accent); }
  .search-ico { color: rgba(255,255,255,.4); display:inline-flex; }
  .search-ico svg { width: 18px; height: 18px; }
  .search input { flex:1; background: transparent; border: 0; color: #fff; font-size: 14px; outline: none; min-width: 0; }
  .search input::placeholder { color: rgba(255,255,255,.3); }
  .search kbd { font-family: var(--mono); font-size: 11px; color: rgba(255,255,255,.3); border: 1px solid rgba(255,255,255,.15); padding: 2px 6px; border-radius: 2px; }

  .hdr-actions { display:flex; align-items:center; gap: 8px; }
  .garage-pill { display:flex; align-items:center; gap: 12px; width:350px; height:66px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.15); color: #fff; padding: 0 14px 0 16px; cursor: pointer; transition: border-color .15s, background .15s; flex-shrink:0; }
  .garage-pill:hover { border-color: var(--accent); background: rgba(255,255,255,.11); }
  .garage-pill-ico { color: var(--accent); display:inline-flex; flex-shrink:0; }
  .garage-pill-ico svg { width: 26px; height: 26px; }
  .garage-pill-txt { display:flex; flex-direction: column; align-items: flex-start; line-height: 1.15; flex:1; }
  .garage-pill-label { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.45); }
  .garage-pill-vehicle { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .03em; color: #fff; }
  .garage-pill-swap { color: rgba(255,255,255,.35); flex-shrink:0; }
  .garage-pill-swap svg { width: 16px; height: 16px; }

  /* ── Garage iframe popup ── */
  .garage-popup-root { position: fixed; inset: 0; z-index: 500; display: flex; align-items: center; justify-content: center; }
  .garage-popup-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); animation: fadeIn .2s ease-out; }
  .garage-popup-card { position: relative; z-index: 1; width: 680px; max-width: 95vw; max-height: 88vh; overflow-y: auto; animation: fadeIn .22s ease-out; box-shadow: 0 24px 64px rgba(0,0,0,.6); }
  .garage-popup-close { position: absolute; top: 12px; right: 12px; z-index: 10; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.15); color: #fff; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1; transition: background .15s; }
  .garage-popup-close:hover { background: var(--accent); }
  .garage-popup-iframe { width: 100%; height: 720px; border: 0; display: block; }
  /* ── Product Detail Popup ── */
  .detail-popup-root { position: fixed; inset: 0; z-index: 500; display: flex; align-items: flex-end; justify-content: center; }
  .detail-popup-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); animation: fadeIn .2s ease-out; }
  .detail-popup-card { position: relative; z-index: 1; width: 100%; max-height: 94vh; overflow: hidden; animation: slideUp .25s ease-out; background: #fff; border-top-left-radius: 12px; border-top-right-radius: 12px; box-shadow: 0 -8px 48px rgba(0,0,0,.5); }
  .detail-popup-close { position: absolute; top: 10px; right: 10px; z-index: 10; background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.2); color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; line-height: 1; transition: background .15s; }
  .detail-popup-close:hover { background: #8B0000; }
  .detail-popup-iframe { width: 100%; height: 90vh; border: 0; display: block; }
  @media(min-width:768px) {
    .detail-popup-root { align-items: center; }
    .detail-popup-card { width: 980px; max-width: 96vw; max-height: 92vh; border-radius: 8px; animation: fadeIn .2s ease-out; }
    .detail-popup-iframe { height: 88vh; }
  }

  .hdr-nav { display:flex; align-items: center; gap: 4px; padding: 0 18px; border-top: 1px solid rgba(255,255,255,.07); overflow-x: auto; scrollbar-width: none; }
  .hdr-nav::-webkit-scrollbar { display: none; }
  .nav-item { font-family: var(--display); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; padding: 14px 14px; color: rgba(255,255,255,.5); white-space: nowrap; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s, border-color .15s; }
  .nav-item:hover { color: #fff; }
  .nav-item.active { color: #fff; border-bottom-color: var(--accent); }

  /* ── Hero ── */
  .hero { background: #000; border-bottom: 1px solid var(--border); }
  .hero-grid { display: grid; grid-template-columns: 1fr 1fr; max-width: 1440px; margin: 0 auto; }
  .hero-copy { padding: 56px 48px; display:flex; flex-direction: column; justify-content: center; gap: 16px; }
  .hero-kicker { font-family: var(--mono); font-size: 11px; letter-spacing: .2em; color: var(--accent); }
  .hero-copy h1 { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 5vw, 64px); line-height: .95; margin: 0; letter-spacing: -.01em; text-transform: uppercase; color: #fff; }
  .hero-copy .amp { color: var(--accent); font-weight: 400; }
  .hero-copy p { color: rgba(255,255,255,.55); max-width: 440px; font-size: 15px; line-height: 1.5; margin: 0; }
  .hero-cta { display:flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .hero-art { position: relative; min-height: 360px; }
  .hero-tag { position: absolute; bottom: 16px; left: 16px; font-family: var(--mono); font-size: 10px; letter-spacing: .2em; padding: 6px 10px; background: var(--accent); color: #fff; font-weight: 600; }

  /* ── Crumbs ── */
  .crumbs { max-width: 1440px; margin: 0 auto; padding: 14px 24px; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-muted); display:flex; align-items:center; gap: 10px; flex-wrap: wrap; }
  .crumbs a { cursor: pointer; }
  .crumbs a:hover { color: var(--accent); }
  .crumb-sep { color: var(--fg-dim); }
  .crumb-now { color: var(--fg); }

  /* ── Mobile search row (inside header, mobile only) ── */
  .mob-search-row { display: none; }

  /* ── Vehicle bar — desktop hidden, mobile only ── */
  .mob-vehicle-bar { display:none; width:350px; margin-left:auto; }
  .mob-vehicle-bar.no-vehicle { background:var(--accent); }
  .mob-vehicle-bar.has-vehicle { background:#1c1c1e; border-bottom:1px solid rgba(255,255,255,.08); }
  .mob-vehicle-bar:hover { filter:brightness(1.08); }
  .mvb-ico { display:inline-flex; flex-shrink:0; }
  .mvb-ico svg { width:26px; height:26px; }
  .mob-vehicle-bar.no-vehicle .mvb-ico svg { stroke:#fff; }
  .mob-vehicle-bar.has-vehicle .mvb-ico svg { stroke:var(--accent); }
  .mvb-label { flex:1; font-family:var(--display); font-weight:700; font-size:15px; letter-spacing:.06em; text-transform:uppercase; color:#fff; }
  .mvb-chev { display:inline-flex; flex-shrink:0; }
  .mvb-chev svg { width:18px; height:18px; stroke:rgba(255,255,255,.6); }

  /* ── Mobile sticky bar ── */
  .mobile-bar { display: none; }

  /* ── Chip rail ── */
  .chip-rail { max-width: 1440px; margin: 0 auto; padding: 0 24px 16px; display:flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip-pill { display:inline-flex; align-items:center; gap: 8px; background: var(--surface2); border: 1px solid var(--border); color: var(--fg); padding: 6px 8px 6px 12px; border-radius: 2px; font-size: 12px; font-weight: 500; cursor: pointer; transition: border-color .15s; }
  .chip-pill:hover { border-color: var(--accent); }
  .chip-pill .chip-x { display:inline-flex; opacity: .6; }
  .chip-pill .chip-x svg { width: 12px; height: 12px; }
  .chip-clear { background: transparent; border:0; color: var(--accent); font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; padding: 6px 8px; }

  /* ── Layout ── */
  .catalog { max-width: 1440px; margin: 0 auto; padding-bottom: 80px; }
  .layout { display: grid; gap: 32px; padding: 0 24px; }
  .layout-sidebar { grid-template-columns: 260px 1fr; }

  /* ── Sidebar ── */
  .sidebar { position: sticky; top: 130px; align-self: start; max-height: calc(100vh - 150px); overflow-y: auto; padding-right: 8px; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

  .filter-panel { display:flex; flex-direction: column; }
  .fit-banner { background: var(--surface2); border-left: 3px solid var(--accent); padding: 14px 16px; margin-bottom: 16px; }
  .fit-banner-label { font-family: var(--mono); font-size: 10px; letter-spacing: .15em; color: var(--fg-dim); }
  .fit-banner-vehicle { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .02em; color: var(--accent); margin-top: 2px; text-transform: uppercase; }
  .fit-toggle { display:flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; cursor: pointer; user-select: none; }
  .fit-toggle input { display: none; }
  .fit-toggle-track { position: relative; width: 32px; height: 18px; background: var(--border-strong); border-radius: 999px; transition: background .15s; flex-shrink: 0; }
  .fit-toggle-thumb { position:absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: #fff; border-radius: 50%; transition: transform .15s; }
  .fit-toggle input:checked + .fit-toggle-track { background: var(--accent); }
  .fit-toggle input:checked + .fit-toggle-track .fit-toggle-thumb { transform: translateX(14px); }

  .filter-section { border-bottom: 1px solid var(--border); }
  .filter-section-head { display:flex; justify-content: space-between; align-items: center; width: 100%; background:transparent; border: 0; padding: 16px 0; color: var(--fg); font-family: var(--display); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; cursor: pointer; }
  .filter-section-chev { transition: transform .2s; color: var(--fg-muted); display:inline-flex; }
  .filter-section-chev svg { width: 12px; height: 12px; }
  .filter-section.open .filter-section-chev { transform: rotate(180deg); }
  .filter-section-body { padding-bottom: 14px; display:flex; flex-direction: column; gap: 8px; }

  .check-row { display:flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px; padding: 4px 0; }
  .check-row input { display: none; }
  .check-box { width: 16px; height: 16px; border: 1.5px solid var(--border-strong); border-radius: 2px; flex-shrink: 0; display:inline-flex; align-items: center; justify-content: center; transition: background .15s, border-color .15s; }
  .check-box .check-mark { color: #fff; opacity: 0; transition: opacity .1s; display:inline-flex; }
  .check-box .check-mark svg { width: 12px; height: 12px; }
  .check-row input:checked + .check-box { background: var(--accent); border-color: var(--accent); }
  .check-row input:checked + .check-box .check-mark { opacity: 1; }
  .check-label { flex: 1; }
  .check-count { color: var(--fg-dim); font-family: var(--mono); font-size: 11px; }

  /* Price */
  .price-range { display:flex; flex-direction: column; gap: 14px; }
  .price-inputs { display:grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .price-inputs label { display:flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); padding: 8px 10px; }
  .price-inputs label span { font-family: var(--mono); font-size: 10px; color: var(--fg-dim); }
  .price-inputs input { background:transparent; border: 0; color: var(--fg); width: 100%; min-width: 0; font-family: var(--mono); outline: none; font-size: 13px; }
  .price-slider { position: relative; height: 24px; }
  .price-track { position: absolute; left: 0; right: 0; top: 11px; height: 2px; background: var(--border-strong); }
  .price-track-fill { position: absolute; top: 0; height: 100%; background: var(--accent); }
  .price-slider input[type="range"] { -webkit-appearance: none; appearance: none; position: absolute; inset: 0; width: 100%; background: transparent; pointer-events: none; height: 24px; }
  .price-slider input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--fg); border: 2px solid var(--accent); pointer-events: auto; cursor: pointer; }
  .price-slider input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--fg); border: 2px solid var(--accent); pointer-events: auto; cursor: pointer; }
  .price-legend { display:flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--fg-muted); }

  /* ── Toolbar ── */
  .toolbar { display:flex; justify-content: space-between; align-items: center; padding: 8px 0 16px; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
  .toolbar-left { display:flex; align-items: center; gap: 12px; }
  .toolbar-right { display:flex; align-items: center; gap: 16px; }
  .tb-count { font-size: 13px; color: var(--fg-muted); }
  .tb-count strong { color: var(--fg); font-weight: 700; }
  .tb-view { display:flex; border: 1px solid var(--border); }
  .tb-view button { background: transparent; border: 0; color: var(--fg-muted); padding: 8px 10px; cursor: pointer; }
  .tb-view button:hover { color: var(--fg); }
  .tb-view button.on { background: var(--surface2); color: var(--accent); }
  .tb-view button svg { width: 16px; height: 16px; }
  .tb-sort { display:flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg-muted); }
  .tb-sort select { background: var(--surface); color: var(--fg); border: 1px solid var(--border); padding: 8px 10px; font-family: inherit; font-size: 13px; cursor: pointer; outline: none; }

  /* ── Grid ── */
  .grid { display:grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: var(--gap); }
  .card { display:flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); transition: border-color .15s, transform .15s; overflow: hidden; }
  .card:hover { border-color: var(--accent); }
  .card:hover .card-media { transform: scale(1.02); }
  .card-media { position: relative; aspect-ratio: 4/3; overflow: hidden; background: #0d0d0e; transition: transform .3s; }
  .card-heart { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; background: rgba(0,0,0,.5); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.1); color: #fff; cursor: pointer; display:inline-flex; align-items: center; justify-content: center; border-radius: 2px; opacity: 0; transition: opacity .15s, color .15s; }
  .card:hover .card-heart { opacity: 1; }
  .card-heart:hover { color: var(--accent); }
  .card-heart svg { width: 16px; height: 16px; }
  .card-fit { position: absolute; top: 10px; left: 10px; display:inline-flex; align-items: center; gap: 5px; background: rgba(62,194,124,.14); border: 1px solid rgba(62,194,124,.5); color: #6ddf9b; padding: 4px 8px; font-family: var(--mono); font-size: 10px; letter-spacing: .15em; font-weight: 600; }
  .card-fit-check svg { width: 11px; height: 11px; }
  .card-body { padding: 14px 16px 16px; display:flex; flex-direction: column; gap: 4px; flex: 1; }
  .card-name { font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: .02em; text-transform: uppercase; line-height: 1.1; }
  .card-sub { color: var(--fg-muted); font-size: 12px; line-height: 1.4; min-height: 32px; }
  .card-meta { display:flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 12px; }
  .card-foot { display:flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 10px; gap: 8px; flex-wrap: wrap; }
  .card-price { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: .01em; }
  .card-brand-label { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--fg-dim); margin-bottom: 2px; }
  .card-cta { background: var(--accent); color:#fff; border:0; padding: 9px 16px; font-family: var(--display); font-weight: 700; letter-spacing: .07em; text-transform: uppercase; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .card-cta:hover { filter: brightness(1.1); }

  /* ── List view ── */
  .list { display:flex; flex-direction: column; gap: 12px; }
  .row { display:grid; grid-template-columns: 200px 1fr 200px; gap: 18px; background: var(--surface); border: 1px solid var(--border); padding: 14px; transition: border-color .15s; }
  .row:hover { border-color: var(--accent); }
  .row-media { aspect-ratio: 4/3; overflow: hidden; background: #0d0d0e; }
  .row-body { display:flex; flex-direction: column; gap: 6px; padding: 4px 0; }
  .row-name { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .02em; text-transform: uppercase; line-height: 1.05; }
  .row-sub { color: var(--fg-muted); font-size: 13px; }
  .row-fit { display:inline-flex; align-items: center; gap: 6px; color: #6ddf9b; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; margin-top: auto; }
  .row-fit svg { width: 12px; height: 12px; }
  .row-side { display:flex; flex-direction: column; align-items: flex-end; gap: 6px; justify-content: center; }
  .row-cta { margin-top: 8px; }

  /* ── Show More ── */
  .show-more-wrap { display:flex; justify-content: center; padding: 32px 0 8px; }
  .show-more-btn { background: transparent; border: 1px solid var(--border-strong); color: var(--fg); padding: 14px 32px; font-family: var(--display); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; cursor: pointer; transition: border-color .15s, background .15s; }
  .show-more-btn:hover { border-color: var(--accent); color: var(--accent); }
  .show-more-count { font-family: var(--mono); font-size: 11px; font-weight: 400; letter-spacing: .05em; text-transform: none; color: var(--fg-dim); }

  /* ── Empty ── */

function matchesTruck(row, garage) {
  if (!garage) return false;
  const year = parseInt(garage.year);
  if (year < row[F.startYear] || year > row[F.endYear]) return false;
  const cm = row[F.make], gm = garage.make;
  const mkOk = cm === gm || (gm==='Chevrolet'&&(cm==='GMC'||cm==='Chevrolet')) || (gm==='GMC'&&(cm==='GMC'||cm==='Chevrolet'));
  if (!mkOk) return false;
  const cmo = row[F.model], gmo = garage.model;
  const moOk = cmo===gmo || cmo.indexOf(gmo)!==-1 || gmo.indexOf(cmo)!==-1
    || (cmo==='Silverado/Sierra'&&(gmo.indexOf('Silverado')!==-1||gmo.indexOf('Sierra')!==-1))

  if (!moOk) return false;
  const bedIn = garage.bedIn || null;
  if (bedIn && row[F.bedIn] && Math.abs(row[F.bedIn] - bedIn) > 2) return false;
  return true;
}

// ── App ──
function App() {
  const [garage, setGarageState] = useState(() => loadGarage());
  const [filters, setFilters] = useState({
    brands: new Set(),
    types: new Set(),
    priceMin: 0,
    priceMax: 2500,
    fitOnly: !!loadGarage(),
  });
  const [sort, setSort] = useState('featured');
  const [view, setView] = useState(() => localStorage.getItem('catalog_view') || 'grid');
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [garageOpen, setGarageOpen] = useState(false);
  const [detailProduct, setDetailProduct] = useState(null);
  const [showCount, setShowCount] = useState(8);
  const openDetail = (brand, name) => setDetailProduct({brand, name});

  // Reset showCount whenever filters or sort change
  useEffect(() => { setShowCount(8); }, [filters, sort, garage]);

  // Persist view
  useEffect(() => { localStorage.setItem('catalog_view', view); }, [view]);

  // Listen for YMM popup submission and update garage state
  useEffect(() => {
    const onYMM = (e) => {
      const { year, make, model } = e.detail;
      const g = { year, make, model, trim:'', bedSize:'', bedIn:null, vin:'' };
      localStorage.setItem('garage_vehicle', JSON.stringify(g));
      setGarageState(g);
      setFilters(f => ({...f, fitOnly:true}));
    };
    window.addEventListener('rlsh:ymm', onYMM);
    return () => window.removeEventListener('rlsh:ymm', onYMM);
  }, []);

  const openGaragePopup = () => setGarageOpen(true);

  // Build unique product list from CATALOG
  const allProducts = useMemo(() => {
    const pm = {};
    CATALOG.forEach(row => {
      const key = `${row[F.brand]}|${row[F.product]}`;
      if (!pm[key]) pm[key] = { id:key, brand:row[F.brand], name:row[F.product], type:PRODUCT_TYPES[row[F.product]]||'', minPrice:null, fitments:[] };
      if (row[F.map] && (pm[key].minPrice === null || row[F.map] < pm[key].minPrice)) pm[key].minPrice = row[F.map];
      pm[key].fitments.push(row);
    });
    return Object.values(pm);
  }, []);

  // Brand/type counts
  const brandCounts = useMemo(() => {
    const c = {};
    allProducts.forEach(p => { c[p.brand] = (c[p.brand]||0)+1; });
    return c;
  }, [allProducts]);

  const typeCounts = useMemo(() => {
    const c = {};
    allProducts.forEach(p => { if(p.type) c[p.type] = (c[p.type]||0)+1; });
    return c;
  }, [allProducts]);

  // Filtered + sorted products
  const filtered = useMemo(() => {
    let list = allProducts.map(p => ({
      ...p,
      fits: p.fitments.some(row => matchesTruck(row, garage))
    }));
    if (filters.brands.size) list = list.filter(p => filters.brands.has(p.brand));
    if (filters.types.size) list = list.filter(p => filters.types.has(p.type));
    list = list.filter(p => p.minPrice === null || (p.minPrice >= filters.priceMin && p.minPrice <= filters.priceMax));
    if (filters.fitOnly && garage) list = list.filter(p => p.fits);
    if (sort === 'price-asc') list.sort((a,b) => (a.minPrice||9999)-(b.minPrice||9999));
    else if (sort === 'price-desc') list.sort((a,b) => (b.minPrice||0)-(a.minPrice||0));
    else if (sort === 'brand') list.sort((a,b) => a.brand.localeCompare(b.brand));
    else list.sort((a,b) => (b.fits?1:0)-(a.fits?1:0));
    return list;
  }, [allProducts, filters, sort, garage]);

  const toggleSet = (key, val) => setFilters(f => {
    const next = new Set(f[key]); next.has(val) ? next.delete(val) : next.add(val);
    return { ...f, [key]: next };
  });

  const activeChips = useMemo(() => {
    const chips = [];
    if (filters.fitOnly && garage) chips.push({ id:'fit', label:`Fits ${garage.year} ${garage.make} ${garage.model}`, onRemove:()=>setFilters(f=>({...f,fitOnly:false})) });
    filters.brands.forEach(b => chips.push({ id:'b-'+b, label:b, onRemove:()=>toggleSet('brands',b) }));
    filters.types.forEach(t => chips.push({ id:'t-'+t, label:t, onRemove:()=>toggleSet('types',t) }));
    if (filters.priceMin>0||filters.priceMax<2500) chips.push({ id:'price', label:`$${filters.priceMin}–$${filters.priceMax}`, onRemove:()=>setFilters(f=>({...f,priceMin:0,priceMax:2500})) });
    return chips;
  }, [filters, garage]);

  const clearAll = () => setFilters({ brands:new Set(), types:new Set(), priceMin:0, priceMax:2500, fitOnly:false });

  const setGarage = (g) => {
    setGarageState(g);
    if (g) { localStorage.setItem('garage_vehicle', JSON.stringify(g)); setFilters(f=>({...f,fitOnly:true})); }
    else { localStorage.removeItem('garage_vehicle'); setFilters(f=>({...f,fitOnly:false})); }
  };

  return (
    <div className="app">
      <Header garage={garage} onSwapVehicle={openGaragePopup} />
      <MobileVehicleBar garage={garage} onSwap={openGaragePopup} />
      <HeroBanner garage={garage} onSwapVehicle={openGaragePopup} />
      <Breadcrumbs />

      <main className="catalog">
        <MobileBar count={filtered.length} onOpenFilters={() => setDrawerOpen(true)} sort={sort} setSort={setSort} view={view} setView={setView} />

        {activeChips.length > 0 &&
          <div className="chip-rail">
            {activeChips.map(c =>
              <button key={c.id} className="chip-pill" onClick={c.onRemove}>
                <span>{c.label}</span>
                <span className="chip-x">{Icon.x}</span>
              </button>
            )}
            <button className="chip-clear" onClick={clearAll}>Clear all</button>
          </div>
        }

        <div className="layout layout-sidebar">
          <aside className="sidebar">
            <FilterPanel filters={filters} setFilters={setFilters} toggleSet={toggleSet} garage={garage} onSwapVehicle={openGaragePopup} brandCounts={brandCounts} typeCounts={typeCounts} />
          </aside>
          <section className="results">
            <Toolbar count={filtered.length} sort={sort} setSort={setSort} view={view} setView={setView} garage={garage} />
            {filtered.length === 0
              ? <div className="empty"><h3>No covers match those filters</h3><p>Try removing a filter or expanding the price range.</p><button className="btn-primary" onClick={clearAll}>Clear all filters</button></div>
              : <>
                  {view === 'grid'
                    ? <div className="grid">{filtered.slice(0, showCount).map((p) => <ProductCard key={p.id} p={p} onOpenDetail={openDetail} />)}</div>
                    : <div className="list">{filtered.slice(0, showCount).map((p) => <ProductRow key={p.id} p={p} garage={garage} onOpenDetail={openDetail} />)}</div>
                  }
                  {filtered.length > showCount && (
                    <div className="show-more-wrap">
                      <button className="show-more-btn" onClick={() => setShowCount(c => c + 8)}>
                        Show more <span className="show-more-count">({filtered.length - showCount} remaining)</span>
                      </button>
                    </div>
                  )}
                </>
            }
          </section>
        </div>
      </main>


      <FilterDrawer open={drawerOpen} onClose={() => setDrawerOpen(false)}>
        <FilterPanel filters={filters} setFilters={setFilters} toggleSet={toggleSet} garage={garage} onSwapVehicle={()=>{setDrawerOpen(false);openGaragePopup();}} brandCounts={brandCounts} typeCounts={typeCounts} mobile />
      </FilterDrawer>

      {garageOpen && <GaragePopup onClose={() => setGarageOpen(false)} />}
      {detailProduct && <ProductDetailPopup brand={detailProduct.brand} name={detailProduct.name} onClose={() => setDetailProduct(null)} />}
    </div>
  );
}

function PriceRange({ filters, setFilters }) {

      <div className="price-inputs">

        <label><span>Max</span><input type="number" value={hi} onChange={e => setFilters(f=>({...f,priceMax:+e.target.value||max}))}/></label>
      </div>
      <div className="price-slider">
        <div className="price-track">
          <div className="price-track-fill" style={{left:`${lo/max*100}%`,right:`${100-hi/max*100}%`}}/>
        </div>
        <input type="range" min={0} max={max} step={50} value={lo} onChange={e => setFilters(f=>({...f,priceMin:Math.min(+e.target.value,f.priceMax-50)}))}/>
        <input type="range" min={0} max={max} step={50} value={hi} onChange={e => setFilters(f=>({...f,priceMax:Math.max(+e.target.value,f.priceMin+50)}))}/>
      </div>
      <div className="price-legend"><span>${lo}</span><span>${hi}{hi>=max?'+':''}</span></div>
    </div>
  );
}

          <button className="card-cta" onClick={e=>{e.stopPropagation();window.location=quoteUrl;}}>Get a Quote</button>
        </div>
      </div>
    </div>
  );
}

function GarageWidget({ garage, onSwap }) {

      <div className="garage-widget-text">

    </div>

// ── Filter Drawer ──
function FilterDrawer({ open, onClose, children }) {
  useEffect(() => {
    if (!open) return;
    const onKey = e => e.key === 'Escape' && onClose();
    document.body.style.overflow = 'hidden';
    window.addEventListener('keydown', onKey);
    return () => { document.body.style.overflow = ''; window.removeEventListener('keydown', onKey); };
  }, [open, onClose]);
  if (!open) return null;
  return (
    <div className="drawer-root">
      <div className="drawer-backdrop" onClick={onClose}/>
      <div className="drawer">
        <div className="drawer-head">
          <h3>Filters</h3>
          <button className="drawer-close" onClick={onClose} aria-label="Close">{Icon.x}</button>
        </div>
        <div className="drawer-body">{children}</div>
      </div>
    </div>
  );
}

// ── Garage Modal ──
function GarageModal({ open, onClose, garage, setGarage }) {
  const [years, setYears] = useState([]);
  const [makes, setMakes] = useState([]);
  const [models, setModels] = useState([]);
  const [selYear, setSelYear] = useState('');
  const [selMake, setSelMake] = useState('');
  const [selModel, setSelModel] = useState('');

  useEffect(() => {
    const y = {};
    CATALOG.forEach(r => { for (let i=r[F.startYear];i<=r[F.endYear];i++) y[i]=true; });
    setYears(Object.keys(y).map(Number).sort((a,b)=>b-a));
  }, []);

  useEffect(() => {
    if (!selYear) { setMakes([]); setSelMake(''); setModels([]); setSelModel(''); return; }
    const yr = parseInt(selYear);
    const m = {};
    CATALOG.forEach(r => { if (yr>=r[F.startYear]&&yr<=r[F.endYear]) m[r[F.make]]=true; });
    setMakes(Object.keys(m).sort());
    setSelMake(''); setModels([]); setSelModel('');
  }, [selYear]);

  useEffect(() => {
    if (!selMake) { setModels([]); setSelModel(''); return; }
    const yr = parseInt(selYear);
    const m = {};
    CATALOG.forEach(r => { if (yr>=r[F.startYear]&&yr<=r[F.endYear]&&r[F.make]===selMake) m[r[F.model]]=true; });
    setModels(Object.keys(m).sort());
    setSelModel('');
  }, [selMake]);

  useEffect(() => {
    if (!open) return;
    const onKey = e => e.key === 'Escape' && onClose();
    document.body.style.overflow = 'hidden';
    window.addEventListener('keydown', onKey);
    return () => { document.body.style.overflow = ''; window.removeEventListener('keydown', onKey); };
  }, [open, onClose]);

  const apply = () => {
    if (!selYear||!selMake||!selModel) { alert('Please select Year, Make, and Model.'); return; }
    setGarage({ year:selYear, make:selMake, model:selModel, trim:'', bedSize:'', bedIn:null, vin:'' });
    onClose();
  };

  if (!open) return null;
  return (
    <div className="drawer-root">
      <div className="drawer-backdrop" onClick={onClose}/>
      <div className="garage-modal">
        <div className="drawer-head">
          <h3>My Garage</h3>
          <button className="drawer-close" onClick={onClose} aria-label="Close">{Icon.x}</button>
        </div>
        <div className="garage-body">
          {garage && (
            <div className="garage-current">
              <div className="garage-current-ico">{Icon.truck}</div>
              <div>
                <div className="garage-current-label">Current vehicle</div>
                <div className="garage-current-vehicle">{garage.year} {garage.make} {garage.model}</div>
                {garage.trim && <div className="garage-current-trim">{garage.trim}</div>}
              </div>
              <button className="btn-ghost garage-remove" onClick={() => { setGarage(null); onClose(); }}>Remove</button>
            </div>
          )}
          <div className="garage-section-title">Select your truck</div>
          <div className="garage-selects">
            <select value={selYear} onChange={e=>setSelYear(e.target.value)}>
              <option value="">Year</option>
              {years.map(y=><option key={y} value={y}>{y}</option>)}
            </select>
            <select value={selMake} onChange={e=>setSelMake(e.target.value)} disabled={!selYear}>
              <option value="">Make</option>
              {makes.map(m=><option key={m} value={m}>{m}</option>)}
            </select>
            <select value={selModel} onChange={e=>setSelModel(e.target.value)} disabled={!selMake}>
              <option value="">Model</option>
              {models.map(m=><option key={m} value={m}>{m}</option>)}
            </select>
          </div>
          <button className="btn-primary garage-go" onClick={apply}>Apply Vehicle</button>
        </div>
      </div>
    </div>
  );
}
