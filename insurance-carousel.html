<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="robots" content="index, follow">

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:#fff;}

    .carriers-section{background:#fff;padding:56px 24px 64px;text-align:center;}

    .carriers-header{margin-bottom:40px;}
    .carriers-eyebrow{font-family:'Montserrat',sans-serif;font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:#8B0000;margin-bottom:10px;}
    .carriers-heading{font-family:'Montserrat',sans-serif;font-size:clamp(20px,3vw,32px);font-weight:900;color:#1a1a1a;letter-spacing:-0.5px;margin-bottom:12px;}
    .carriers-heading em{font-style:normal;color:#8B0000;}
    .carriers-sub{font-size:13px;font-weight:400;color:#888;max-width:560px;margin:0 auto;line-height:1.7;}

    .logo-grid{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      align-items:center;
      gap:16px 24px;
      max-width:1100px;
      margin:0 auto 28px;
    }

    .logo-tile{
      display:flex;align-items:center;justify-content:center;
    }
    .logo-tile img{
      width:90px;height:32px;
      object-fit:contain;display:block;
      opacity:0.75;
      transition:opacity 0.2s;
    }
    .logo-tile img:hover{opacity:1;}

    .carriers-note{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:#555;padding:0 24px;}
    .carriers-note a{color:#8B0000;text-decoration:none;}
    .carriers-note a:hover{text-decoration:underline;}

    @media(max-width:600px){
      .carriers-section{padding:36px 16px 48px;}
      .carriers-header{margin-bottom:24px;}
      .logo-grid{
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:14px 8px;
      }
      .logo-tile img{width:100%;height:24px;}
    }
  </style>
</head>
<body>

  <p class="carriers-note">Don't see your carrier? <strong>We work with everyone.</strong> Call us at <a href="tel:+15624246744">562-424-6744</a>.</p>

</section>

<script>
  function reportHeight(){
    var h = Math.max(document.body.scrollHeight,document.body.offsetHeight,document.documentElement.scrollHeight,document.documentElement.offsetHeight);
    window.parent.postMessage(JSON.stringify({height:h}),'*');
  }
  document.addEventListener('DOMContentLoaded', reportHeight);
  window.addEventListener('load', function(){ [0,200,500,1000,2000].forEach(function(t){ setTimeout(reportHeight,t); }); });
  window.addEventListener('resize', reportHeight);
  if(window.ResizeObserver){ new ResizeObserver(reportHeight).observe(document.body); }
</script>

</body>
