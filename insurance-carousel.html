<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insurance Carriers We Work With — State Farm, Geico, Progressive & More | 3J's Auto Body</title>
  <meta name="description" content="3J's Auto Body works with all major insurance carriers in Signal Hill, CA: State Farm, Geico, Progressive, Allstate, Farmers, AAA, and more. We handle the paperwork.">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Insurance Carriers — All Major Carriers | 3J's Auto Body Signal Hill CA">
  <meta property="og:description" content="We work directly with all major insurance carriers. Let 3J's Auto Body handle your claim paperwork in Signal Hill, CA.">
  <meta property="og:site_name" content="3J's Auto Body &amp; Paint">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Montserrat',sans-serif;background:#fff;}

    .carriers-section{
      background:#fff;
      padding:56px 0 64px;
      text-align:center;
    }

    .carriers-header{padding:0 24px;margin-bottom:40px;}
    .carriers-eyebrow{
      font-size:10px;font-weight:800;letter-spacing:3px;
      text-transform:uppercase;color:#8B0000;margin-bottom:10px;
    }
    .carriers-heading{
      font-size:clamp(20px,3vw,32px);font-weight:900;
      color:#1a1a1a;letter-spacing:-0.5px;margin-bottom:12px;
    }
    .carriers-heading em{font-style:normal;color:#8B0000;}
    .carriers-sub{
      font-size:13px;font-weight:500;color:#888;letter-spacing:0.3px;
      max-width:560px;margin:0 auto;line-height:1.7;
    }

    /* Marquee */
    .marquee-wrapper{
      width:100%;overflow:hidden;position:relative;
      -webkit-mask-image:linear-gradient(to right,transparent 0%,black 8%,black 92%,transparent 100%);
      mask-image:linear-gradient(to right,transparent 0%,black 8%,black 92%,transparent 100%);
      margin-bottom:16px;
    }
    .marquee-track{
      display:flex;align-items:center;gap:20px;width:max-content;
      animation:scroll-left 40s linear infinite;
    }
    .marquee-track.reverse{
      animation:scroll-right 40s linear infinite;
    }
    .marquee-wrapper:hover .marquee-track{animation-play-state:paused;}
    @keyframes scroll-left{
      0%{transform:translateX(0);}
      100%{transform:translateX(-50%);}
    }
    @keyframes scroll-right{
      0%{transform:translateX(-50%);}
      100%{transform:translateX(0);}
    }

    /* Logo tile */
    .logo-tile{
      display:flex;align-items:center;justify-content:center;
      background:#fff;
      border:1px solid #e8e8e8;
      border-radius:8px;
      padding:8px 14px;
      height:52px;
      width:120px;
      flex-shrink:0;
      box-shadow:0 1px 6px rgba(0,0,0,0.06);
    }
    .logo-tile img{
      width:80px;
      height:28px;
      object-fit:contain;
      display:block;
      flex-shrink:0;
    }

    .carriers-note{
      font-size:12px;font-weight:600;color:#555;
      margin-top:8px;padding:0 24px;
    }
    .carriers-note a{color:#8B0000;text-decoration:none;}
    .carriers-note a:hover{text-decoration:underline;}
  </style>
</head>
<body>

<section class="carriers-section">

  <div class="carriers-header">
    <p class="carriers-eyebrow">Insurance Claims</p>
    <h2 class="carriers-heading">We Work With <em>All Major Carriers</em></h2>
    <p class="carriers-sub">We handle the paperwork directly with your insurance company so you don't have to. Just bring your vehicle in — we take it from there.</p>
  </div>

  <!-- Row 1 — scrolls left -->
  <div class="marquee-wrapper">
    <div class="marquee-track" id="ins-track-1">
      <div class="logo-tile"><img src="ins-state-farm.png" alt="State Farm"></div>
      <div class="logo-tile"><img src="ins-geico.png" alt="Geico"></div>
      <div class="logo-tile"><img src="ins-progressive.png" alt="Progressive"></div>
      <div class="logo-tile"><img src="ins-allstate.png" alt="Allstate"></div>
      <div class="logo-tile"><img src="ins-farmers.png" alt="Farmers Insurance"></div>
      <div class="logo-tile"><img src="ins-usaa.png" alt="USAA"></div>
      <div class="logo-tile"><img src="ins-liberty-mutual.png" alt="Liberty Mutual"></div>
      <div class="logo-tile"><img src="ins-metlife.png" alt="MetLife"></div>
      <div class="logo-tile"><img src="ins-nationwide.png" alt="Nationwide"></div>
      <div class="logo-tile"><img src="ins-safeco.png" alt="Safeco Insurance"></div>
    </div>
  </div>

  <!-- Row 2 — scrolls right -->
  <div class="marquee-wrapper" style="margin-bottom:28px;">
    <div class="marquee-track reverse" id="ins-track-2">
      <div class="logo-tile"><img src="ins-21st-century.png" alt="21st Century Insurance"></div>
      <div class="logo-tile"><img src="ins-kemper.png" alt="Kemper"></div>
      <div class="logo-tile"><img src="ins-bristol-west.png" alt="Bristol West"></div>
      <div class="logo-tile"><img src="ins-infinity.png" alt="Infinity Insurance"></div>
      <div class="logo-tile"><img src="ins-national-general.png" alt="National General"></div>
      <div class="logo-tile"><img src="ins-wawanesa.png" alt="Wawanesa Insurance"></div>
      <div class="logo-tile"><img src="ins-hartford.png" alt="The Hartford"></div>
      <div class="logo-tile"><img src="ins-american-family.png" alt="American Family Insurance"></div>
      <div class="logo-tile"><img src="ins-amshield.png" alt="AmShield Insurance"></div>
      <div class="logo-tile"><img src="ins-mendota.png" alt="Mendota Insurance"></div>
    </div>
  </div>

  <p class="carriers-note">Don't see your carrier? <strong>We work with everyone.</strong> Call us at <a href="tel:+15624246744">562-424-6744</a>.</p>

</section>

<script>
  var t1 = document.getElementById('ins-track-1');
  t1.innerHTML += t1.innerHTML;
  var t2 = document.getElementById('ins-track-2');
  t2.innerHTML += t2.innerHTML;

  function reportHeight(){
    var h = Math.max(
      document.body.scrollHeight,
      document.body.offsetHeight,
      document.documentElement.scrollHeight,
      document.documentElement.offsetHeight
    );
    window.parent.postMessage(JSON.stringify({height:h}),'*');
  }
  document.addEventListener('DOMContentLoaded', reportHeight);
  window.addEventListener('load', function(){
    [0,200,500,1000,2000,3500].forEach(function(t){ setTimeout(reportHeight,t); });
  });
  window.addEventListener('resize', reportHeight);
  if(window.ResizeObserver){ new ResizeObserver(reportHeight).observe(document.body); }
  }
  window.addEventListener('load', function(){ reportHeight(); setTimeout(reportHeight,500); setTimeout(reportHeight,1500); });
  window.addEventListener('resize',reportHeight);
  if(window.ResizeObserver){ new ResizeObserver(reportHeight).observe(document.body); }
</script>
<script>document.querySelectorAll('a[href^="tel:"]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();try{window.top.location.href=a.getAttribute('href');}catch(x){window.location.href=a.getAttribute('href');}});});</script>
</body>
</html>
