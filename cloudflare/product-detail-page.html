<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Product Detail · 3J's Auto Body &amp; Paint</title>
<meta name="description" content="Truck and Jeep accessories, professionally installed at 3J's Auto Body, Signal Hill, CA." />
<meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800;900&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<link rel="canonical" href="https://www.3jsautobody.com/product-detail-page">
<style>
  :root {
    --bg:#ffffff; --surface:#ffffff; --surface2:#f2f2f2;
    --border:rgba(0,0,0,.10); --border-strong:rgba(0,0,0,.20);
    --fg:#1a1815; --fg-muted:rgba(26,24,21,.62); --fg-dim:rgba(26,24,21,.42);
    --accent:#8B0000;
    --display:'Oswald', Impact, sans-serif;
    --body:'Inter', system-ui, sans-serif;
    --mono:'Inter', system-ui, sans-serif;
  }
  *,*::before,*::after { box-sizing: border-box; }
  html { margin:0; padding:0; overscroll-behavior: none; }
  body { font-family: var(--body); background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased; overflow-x: hidden; margin:0; padding:0; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  svg { display:inline-block; vertical-align: middle; }
  ::selection { background: var(--accent); color:#fff; }

  @keyframes pageFadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pageFadeDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pageFade { from { opacity: 0; } to { opacity: 1; } }
  .hdr { animation: pageFadeDown .55s cubic-bezier(.2,.7,.2,1) both; }
  .crumbs { animation: pageFadeUp .6s cubic-bezier(.2,.7,.2,1) both; animation-delay: .08s; }
  .pdp-top > .gallery { animation: pageFadeUp .75s cubic-bezier(.2,.7,.2,1) both; animation-delay: .14s; }
  .pdp-top > .pdp-info { animation: pageFadeUp .75s cubic-bezier(.2,.7,.2,1) both; animation-delay: .22s; }
  .pdp-tabs { animation: pageFadeUp .7s cubic-bezier(.2,.7,.2,1) both; animation-delay: .34s; }
  .related { animation: pageFade .7s ease both; animation-delay: .42s; }
  @media (prefers-reduced-motion: reduce) {
    .hdr,.crumbs,.pdp-top>.gallery,.pdp-top>.pdp-info,.pdp-tabs,.related { animation: none; }
  }

  .btn-primary { background: var(--accent); color:#fff; border:0; padding: 12px 18px; font-family: var(--display); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; cursor: pointer; transition: filter .15s, transform .1s; border-radius: 0; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-ghost { background: transparent; color: var(--fg); border: 1px solid var(--border-strong); padding: 12px 18px; font-family: var(--display); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; cursor: pointer; border-radius: 0; }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  /* Header — mobile base */
  .hdr { position: sticky; top: 0; z-index: 50; background: rgba(10,10,12,.97); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,.08); }
  .hdr-promo { display: none; }
  .hdr-promo .bolt { color: var(--accent); display:inline-flex; }
  .hdr-promo .bolt svg { width: 14px; height: 14px; }
  .hdr-ticker { display:flex; white-space:nowrap; animation: ticker-scroll 38s linear infinite; }
  .hdr-ticker-item { display:inline-flex; align-items:center; gap: 8px; padding: 0 60px; letter-spacing: 1.8px; }
  @keyframes ticker-scroll { 0% { transform:translateX(0); } 100% { transform:translateX(-50%); } }
  .hdr-main { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; padding: 10px 16px; }
  .logo { display:flex; align-items:center; }
  .logo img { height: 44px; display:block; }
  .hdr-actions { display:flex; align-items:center; gap: 10px; }
  .garage-pill { display:flex; align-items:center; gap: 12px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.15); color: #fff; padding: 8px; cursor: pointer; transition: border-color .15s, background .15s; border-radius: 0; }
  .garage-pill:hover { border-color: var(--accent); background: rgba(255,255,255,.11); }
  .garage-pill-ico { color: var(--accent); display:inline-flex; flex-shrink:0; }
  .garage-pill-ico svg { width: 24px; height: 24px; }
  .garage-pill-txt { display: none; flex-direction: column; align-items: flex-start; line-height: 1.15; }
  .garage-pill-label { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.45); }
  .garage-pill-vehicle { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .03em; color: #fff; }
  .hdr-nav { display:flex; align-items: center; gap: 4px; padding: 0 8px; border-top: 1px solid rgba(255,255,255,.07); overflow-x: auto; scrollbar-width: none; }
  .hdr-nav::-webkit-scrollbar { display: none; }
  .nav-item { font-family: var(--display); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; padding: 12px 10px; color: rgba(255,255,255,.5); white-space: nowrap; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s, border-color .15s; }
  .nav-item:hover { color: #fff; }
  .nav-item.active { color: #fff; border-bottom-color: var(--accent); }

  /* Crumbs */
  .crumbs { max-width: 1440px; margin: 0 auto; padding: 14px 16px 12px; font-family: var(--body); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 500; color: var(--fg-muted); display:flex; align-items:center; gap: 10px; flex-wrap: wrap; }
  .crumbs a { cursor: pointer; }
  .crumbs a:hover { color: var(--accent); }
  .crumb-sep { color: var(--fg-dim); }
  .crumb-now { color: #000; font-weight: 700; }

  /* PDP Layout — mobile base */
  .pdp { max-width: 1440px; margin: 0 auto; padding: 0 16px 100px; }
  .pdp-top { display: grid; grid-template-columns: 1fr; gap: 28px; align-items: start; padding-top: 8px; }

  /* Gallery — mobile base: main image top, horizontal thumb row below */
  .gallery { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: start; }
  .gal-thumbs { display:flex; flex-direction: row; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
  .gal-thumbs::-webkit-scrollbar { display: none; }
  .gal-thumb { width: 72px; height: 72px; background: var(--surface2); border: 1.5px solid var(--border); cursor: pointer; overflow: hidden; transition: border-color .15s; padding: 0; position: relative; flex-shrink: 0; }
  .gal-thumb:hover { border-color: var(--border-strong); }
  .gal-thumb.active { border-color: var(--accent); }
  .gal-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gal-thumb-more { position: relative; }
  .gal-more-overlay { position: absolute; inset: 0; background: rgba(10,10,12,.65); display:flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; font-size: 16px; color: #fff; letter-spacing: .04em; }
  .gal-main { position: relative; aspect-ratio: 4/3; background: var(--surface2); overflow: hidden; border: 1px solid var(--border); }
  .gal-main img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gal-main-placeholder { width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;color:var(--fg-dim);letter-spacing:.08em;text-transform:uppercase; }

  /* Info column — mobile base: not sticky */
  .pdp-info { display:flex; flex-direction: column; gap: 14px; position: relative; top: 0; align-self: start; padding-right: 4px; }
  .pdp-brand { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--fg-muted); font-weight: 600; }
  .pdp-brand .sep { color: var(--fg-dim); margin: 0 8px; }
  .pdp-title { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 7vw, 38px); line-height: .98; letter-spacing: -.005em; text-transform: uppercase; margin: 0; color: var(--fg); }
  .pdp-sub { font-size: 14px; color: var(--fg-muted); line-height: 1.55; max-width: 480px; margin: 0; }
  .pdp-type-badge { display:inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; background: var(--surface2); border: 1px solid var(--border-strong); padding: 4px 10px; color: var(--fg-muted); }

  /* Fitment block */
  .pdp-fit { display:flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface2); border-top: 3px solid #097530; }
  .pdp-fit.no-fit { border-top-color: var(--accent); }
  .pdp-fit.no-garage { border-top-color: var(--border-strong); }
  .pdp-fit-ico { width: 22px; height: 22px; color: #097530; display:inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .pdp-fit-ico svg { width: 14px; height: 14px; }
  .pdp-fit-body { flex: 1; min-width: 0; }
  .pdp-fit-label { font-family: var(--mono); font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--fg-dim); }
  .pdp-fit-vehicle { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .02em; text-transform: uppercase; color: var(--fg); margin-top: 1px; }
  .pdp-fit-link { font-size: 12px; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-weight: 500; }

  /* Variants */
  .variants { display:flex; flex-direction: column; gap: 16px; padding: 18px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .var-group-label { font-family: var(--mono); font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--fg-dim); margin-bottom: 8px; }
  .var-options { display:flex; gap: 8px; flex-wrap: wrap; }
  .var-chip { background: transparent; border: 1.5px solid var(--border-strong); color: var(--fg); padding: 10px 16px; font-family: var(--display); font-weight: 600; letter-spacing: .04em; font-size: 13px; cursor: pointer; transition: all .15s; min-width: 80px; text-align: center; border-radius: 0; }
  .var-chip:hover { border-color: var(--fg); }
  .var-chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }

  /* Price + CTA */
  .pdp-price-row { display:flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .pdp-price { font-family: var(--display); font-weight: 800; font-size: 36px; letter-spacing: .01em; line-height: 1; color: var(--fg); }
  .pdp-price-from { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; color: var(--fg-dim); align-self: center; }
  .pdp-stock { display:inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: #097530; padding-top: 6px; }
  .pdp-stock-dot { width: 8px; height: 8px; border-radius: 50%; background: #097530; }
  .pdp-cta { background: var(--accent); color: #fff; border: 0; width: 100%; height: 42px; font-family: var(--display); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 13px; cursor: pointer; transition: filter .15s; display:inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 0 18px; border-radius: 0; text-decoration: none; }
  .pdp-cta:hover { filter: brightness(1.12); }
  .pdp-cta svg { width: 18px; height: 18px; }
  .pdp-secondary { display:flex; gap: 8px; flex-wrap: wrap; }
  .pdp-sec-btn { background: transparent; border: 1px solid var(--border-strong); color: var(--fg); padding: 10px 14px; font-family: var(--display); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: 12px; cursor: pointer; display:inline-flex; align-items: center; gap: 6px; border-radius: 0; }
  .pdp-sec-btn:hover { border-color: var(--accent); color: var(--accent); }
  .pdp-sec-btn svg { width: 14px; height: 14px; }

  /* Trust badges — mobile base: single column */
  .trust { display:grid; grid-template-columns: 1fr; gap: 10px; padding: 16px 0 4px; border-top: 1px solid var(--border); margin-top: 4px; }
  .trust-item { display:flex; gap: 10px; align-items: flex-start; }
  .trust-ico { color: var(--accent); flex-shrink: 0; padding-top: 2px; }
  .trust-ico svg { width: 22px; height: 22px; }
  .trust-text { font-size: 11px; line-height: 1.4; }
  .trust-text strong { display: block; font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
  .trust-text span { color: var(--fg-muted); }

  /* Quick highlights */
  .highlights { padding: 16px 0 4px; }
  .highlights-title { font-family: var(--mono); font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--fg-dim); margin-bottom: 10px; }
  .highlights ul { list-style: none; padding: 0; margin: 0; display:flex; flex-direction: column; gap: 8px; }
  .highlights li { display:flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 1.5; color: var(--fg); }
  .highlights li::before { content: ''; display:inline-block; width: 6px; height: 6px; background: var(--accent); margin-top: 8px; flex-shrink: 0; }

  /* Tabs */
  .pdp-tabs { margin-top: 56px; border-top: 1px solid var(--border); }
  .tabs-bar { display:flex; gap: 0; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
  .tabs-bar::-webkit-scrollbar { display: none; }
  .tab-btn { background: transparent; border: 0; padding: 18px 22px; font-family: var(--display); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; color: #555; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; transition: color .15s, border-color .15s; }
  .tab-btn:hover { color: var(--fg); }
  .tab-btn.on { color: var(--fg); border-bottom-color: var(--accent); }
  .tab-count { font-family: var(--mono); font-weight: 400; font-size: 11px; margin-left: 6px; color: var(--fg-dim); letter-spacing: .04em; text-transform: none; }
  /* Tab panel — mobile base: single column */
  .tab-panel { padding: 32px 0; display:grid; grid-template-columns: 1fr; gap: 32px; align-items: start; }

  /* Description panel */
  .desc h3 { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .03em; text-transform: uppercase; margin: 0 0 12px; }
  .desc p { font-size: 15px; line-height: 1.65; color: var(--fg); margin: 0 0 16px; max-width: 680px; }
  /* Feat grid — mobile base: single column */
  .feat-grid { display:grid; grid-template-columns: 1fr; gap: 14px; margin: 18px 0 8px; }
  .feat-card { background: transparent; border: 1px solid var(--border); border-top: 2px solid var(--accent); padding: 14px 16px; }
  .feat-card-title { font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 4px; }
  .feat-card-body { font-size: 12px; color: var(--fg-muted); line-height: 1.5; }

  /* Specs */
  .specs-table { width: 100%; border-collapse: collapse; border-top: 1px solid var(--border); }
  .specs-table tr { border-bottom: 1px solid var(--border); }
  .specs-table td { padding: 12px 0; font-size: 13px; vertical-align: top; }
  .specs-table td:first-child { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-muted); width: 50%; }
  .specs-table td:last-child { color: var(--fg); font-weight: 500; }

  /* Aside */
  .tab-aside { display:flex; flex-direction: column; gap: 16px; }
  .install-card { background: var(--surface2); border: 1px solid var(--border); padding: 20px; }
  .install-card-eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--fg-muted); margin-bottom: 6px; }
  .install-card h4 { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .03em; text-transform: uppercase; margin: 0 0 8px; }
  .install-card p { font-size: 13px; line-height: 1.5; color: var(--fg-muted); margin: 0 0 12px; }
  .install-card .row-btns { display:flex; gap: 8px; flex-wrap: wrap; }
  .install-card .row-btns a { display:inline-flex; align-items: center; text-decoration: none; }

  /* Reviews — mobile base: single column */
  .reviews-summary { display:grid; grid-template-columns: 1fr; gap: 16px; padding-bottom: 24px; border-bottom: 1px solid var(--border); margin-bottom: 24px; align-items: start; }
  .rev-big-num { font-family: var(--display); font-weight: 800; font-size: 72px; line-height: 1; color: var(--fg); }
  .rev-stars { padding-top: 8px; }
  .rev-count { font-family: var(--mono); font-size: 11px; color: var(--fg-muted); margin-top: 6px; }
  .rev-bars { display:flex; flex-direction: column; gap: 6px; }
  .rev-bar-row { display:grid; grid-template-columns: 28px 1fr 36px; gap: 10px; align-items: center; font-size: 12px; }
  .rev-bar-row .lbl { font-family: var(--mono); color: var(--fg-muted); }
  .rev-bar-track { height: 6px; background: var(--border); position: relative; }
  .rev-bar-fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--accent); }
  .rev-bar-num { font-family: var(--mono); font-size: 11px; color: var(--fg-dim); text-align: right; }
  .rev-list { display:flex; flex-direction: column; gap: 20px; }
  .rev-card { padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .rev-card-head { display:flex; gap: 10px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
  .rev-avatar { width: 36px; height: 36px; background: var(--surface2); border: 1px solid var(--border); display:inline-flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--fg); flex-shrink: 0; }
  .rev-name { font-weight: 600; font-size: 13px; }
  .rev-verified { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: #1f7e3e; background: rgba(62,194,124,.1); padding: 2px 6px; }
  .rev-date { font-family: var(--mono); font-size: 11px; color: var(--fg-dim); margin-left: auto; }
  .rev-card-title { font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: .02em; margin: 6px 0 4px; }
  .rev-card-body { font-size: 13px; line-height: 1.6; color: var(--fg); }
  .rev-truck-tag { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-dim); margin-top: 8px; }

  /* Q&A */
  .qa-list { display:flex; flex-direction: column; gap: 18px; }
  .qa-item { display:grid; grid-template-columns: auto 1fr; gap: 12px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
  .qa-tag { font-family: var(--display); font-weight: 800; font-size: 14px; letter-spacing: .06em; color: var(--accent); width: 24px; flex-shrink: 0; padding-top: 2px; }
  .qa-tag.ans { color: var(--fg); }
  .qa-q-text { font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: .02em; }
  .qa-a-text { font-size: 13px; line-height: 1.6; color: var(--fg-muted); margin-top: 6px; }
  .qa-a-meta { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-dim); margin-top: 8px; }
  .qa-ask { background: var(--surface2); border: 1px dashed var(--border-strong); padding: 16px; margin-top: 8px; display:flex; justify-content:space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  .qa-ask-text { font-size: 13px; }
  .qa-ask-text strong { font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; display: block; margin-bottom: 2px; }

  /* Related — mobile base: 1 col */
  .product-strip { margin-top: 56px; }
  .strip-head { display:flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; flex-wrap: wrap; gap: 8px; }
  .strip-head h2 { font-family: var(--display); font-weight: 800; font-size: 28px; letter-spacing: .04em; text-transform: uppercase; margin: 0; }
  .strip-head a { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); cursor: pointer; }
  .strip-grid { display:grid; grid-template-columns: 1fr; gap: 18px; }
  .rel-card { background: var(--surface); border: 1px solid var(--border); transition: border-color .15s; overflow: hidden; cursor: pointer; display:flex; flex-direction: column; text-decoration: none; }
  .rel-card:hover { border-color: var(--accent); }
  .rel-media { aspect-ratio: 4/3; background: var(--surface2); overflow: hidden; position: relative; }
  .rel-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rel-media-placeholder { width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--fg-dim);letter-spacing:.06em; }
  .rel-body { padding: 12px 14px 14px; display:flex; flex-direction: column; gap: 4px; flex: 1; }
  .rel-brand { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--fg-dim); }
  .rel-name { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .02em; text-transform: uppercase; line-height: 1.1; margin: 2px 0 4px; }
  .rel-sub { font-size: 11px; color: var(--fg-muted); margin-bottom: 8px; }
  .rel-foot { display:flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 6px; }
  .rel-price { font-family: var(--display); font-weight: 800; font-size: 18px; }
  .rel-fit { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; color: #1f7e3e; }

  /* FAQ */
