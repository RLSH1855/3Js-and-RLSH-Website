# cloudflare/gsc-sync-worker/wrangler.toml
name = "3js-gsc-sync"
main = "index.js"
compatibility_date = "2024-01-01"

# 09:00 UTC = 1-2am Pacific, after Google has settled the previous day.
[triggers]
crons = ["0 9 * * *"]

# Same database the Pages project uses.
[[d1_databases]]
binding = "DB"
database_name = "3js-ai-assistant"
database_id = "c054bea5-16d0-4ccb-ab90-d966b44cc228"
