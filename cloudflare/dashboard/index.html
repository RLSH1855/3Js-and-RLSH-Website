<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>3J's AI Assistant — Owner Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  html{overscroll-behavior:none;}
  body{overflow-x:hidden;margin:0;background:#0b0b0b;color:#eee;font-family:'Inter',Arial,sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:32px 20px;}
  h1{font-family:'Montserrat',sans-serif;font-weight:800;font-size:18px;letter-spacing:1px;text-transform:uppercase;color:#fff;}
  .login-box{max-width:320px;margin:80px auto;display:flex;flex-direction:column;gap:12px;}
  input{background:#1a1a1a;border:1px solid #333;color:#fff;padding:12px;border-radius:0;font-size:14px;}
  button{background:#8B0000;border:2px solid #8B0000;color:#fff;padding:12px;border-radius:0;font-weight:800;
    letter-spacing:1px;text-transform:uppercase;cursor:pointer;font-size:13px;}
  button:hover{filter:brightness(1.2);}
  .dashboard-nav{display:flex;flex-direction:column;gap:0;border-bottom:1px solid #333;margin-bottom:20px;}
  .nav-item{padding:12px 4px;font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
    color:rgba(255,255,255,.6);border-bottom:3px solid transparent;cursor:default;}
  .nav-item.active{color:#fff;border-bottom-color:#8B0000;}
  .conv-list{display:flex;flex-direction:column;gap:8px;margin-top:20px;}
  .conv-item{background:#1a1a1a;border:1px solid #333;border-left:3px solid #8B0000;padding:14px;cursor:pointer;}
  .conv-item .lead-flag{color:#ff6b6b;font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:1px;}
  .hidden{display:none;}
  .msg{padding:8px 0;border-bottom:1px solid #222;font-size:14px;}
  .msg.user{color:#fff;}
  .msg.assistant{color:rgba(255,255,255,.8);}
  #export-btn{margin-top:20px;}
  @media(min-width:768px){
    .wrap{padding:48px 32px;}
    .dashboard-nav{flex-direction:row;gap:24px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>3J's AI Assistant — Owner Dashboard</h1>

  <div id="login-view" class="login-box">
    <input id="username" type="text" placeholder="Username" />
    <input id="password" type="password" placeholder="Password" />
    <button id="login-btn">Log In</button>
    <div id="login-error" style="color:#ff6b6b;font-size:13px;"></div>
  </div>

  <div id="dashboard-view" class="hidden">
    <nav class="dashboard-nav">
      <div class="nav-item active">AI Conversations</div>
    </nav>
    <button id="export-btn">Export Leads (CSV)</button>
    <div id="conv-list" class="conv-list"></div>
    <div id="conv-detail" class="hidden">
      <button id="back-btn">&larr; Back to list</button>
      <div id="conv-messages"></div>
    </div>
  </div>
</div>
<script src="dashboard.js"></script>
</body>
</html>
