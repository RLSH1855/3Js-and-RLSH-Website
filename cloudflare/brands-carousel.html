<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top Aftermarket Brands — Rhino Liner, BakFlip, AMP Research & More | 3J's Auto Body</title>
  <meta name="description" content="3J's Auto Body installs top aftermarket brands: Rhino Liner, BakFlip, AMP Research, WeatherTech, Extang, TruXedo, Westin, and more. Signal Hill, CA.">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Top Aftermarket Brands We Install | 3J's Auto Body">
  <meta property="og:description" content="We install and source the best aftermarket truck brands: Rhino Liner, BakFlip, AMP Research, WeatherTech, and more. Signal Hill, CA.">
  <meta property="og:site_name" content="3J's Auto Body &amp; Paint">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{overflow-y:hidden;}
    body{font-family:'Montserrat',sans-serif;background:#fff;}

    .brands-section{
      background:#fff;
      padding:clamp(40px,6vw,72px) 0;
      text-align:center;
    }

    .brands-header{padding:0 clamp(16px,4vw,24px);margin-bottom:clamp(24px,4vw,40px);}
    .brands-eyebrow{
      font-size:10px;font-weight:800;letter-spacing:3px;
      text-transform:uppercase;color:#8B0000;margin-bottom:10px;
    }
    .brands-heading{
      font-size:clamp(20px,3vw,32px);font-weight:900;
      color:#1a1a1a;letter-spacing:-0.5px;margin-bottom:6px;
    }
    .brands-heading em{font-style:normal;color:#8B0000;}
    .brands-sub{
      font-size:13px;font-weight:500;color:#888;letter-spacing:0.3px;
    }

    @media(max-width:640px){
      .marquee-wrapper:last-child{margin-bottom:0;}
      .logo-card{width:130px;height:60px;padding:10px 14px;}
      .logo-card img{width:100px;height:34px;}
    }

    /* Marquee */
    .marquee-wrapper{
      width:100%;overflow:hidden;position:relative;
      margin-bottom:16px;
      padding-bottom:8px;
      -webkit-mask-image:linear-gradient(to right,transparent 0%,black 6%,black 94%,transparent 100%);
      mask-image:linear-gradient(to right,transparent 0%,black 6%,black 94%,transparent 100%);
    }
    .marquee-track{
      display:flex;align-items:center;gap:16px;width:max-content;will-change:transform;
    }
    .marquee-track{animation-timing-function:linear;animation-iteration-count:infinite;}
    .marquee-track.row-1{animation-name:scrollLeft;animation-duration:32s;}
    .marquee-track.row-2{animation-name:scrollRight;animation-duration:40s;}
    .marquee-wrapper:hover .marquee-track{animation-play-state:paused;}
    @keyframes scrollLeft{0%{transform:translateX(0);}100%{transform:translateX(var(--w1,0px));}}
    @keyframes scrollRight{0%{transform:translateX(var(--w2-neg,0px));}100%{transform:translateX(0);}}

    /* Logo card */
    .logo-card{
      display:inline-flex;align-items:center;justify-content:center;
      height:72px;
      width:160px;
      padding:12px 20px;
      background:#fff;
      border:1.5px solid #ebebeb;
      border-radius:0;
      flex-shrink:0;
      transition:border-color 0.3s,box-shadow 0.3s;
      box-shadow:0 2px 8px rgba(0,0,0,0.04);
      cursor:default;
    }
    .logo-card:hover{
      border-color:#ccc;
      box-shadow:0 6px 24px rgba(0,0,0,0.10);
    }
    .logo-card img{
      width:120px;
      height:40px;
      object-fit:contain;
      filter:grayscale(1) opacity(0.55);
      transition:filter 0.3s;
    }
    .logo-card:hover img{
      filter:grayscale(0) opacity(1);
    }
    @media(prefers-reduced-motion:reduce){
      .marquee-track{animation-play-state:paused;}
    }
  </style>
</head>
<body>

<section class="brands-section">

  <div class="brands-header">
    <p class="brands-eyebrow">Trusted Products</p>
    <h2 class="brands-heading">Top <em>Aftermarket Brands</em> We Install</h2>
    <p class="brands-sub">Premium brands. Professional installation. Built to last.</p>
  </div>

  <!-- Row 1 — scrolls left -->
  <div class="marquee-wrapper">
    <div class="marquee-track row-1" id="row1">
      <div class="logo-card"><img src="rhino%20linings.webp" alt="Rhino Liner" loading="lazy"></div>
      <div class="logo-card"><img src="brand-logo%20(1).webp" alt="AMP Research" loading="lazy"></div>
      <div class="logo-card"><img src="brand-logo%20(2).webp" alt="UnderCover" loading="lazy"></div>
      <div class="logo-card"><img src="brand-logo%20(4).webp" alt="TruXedo" loading="lazy"></div>
      <div class="logo-card"><img src="brand-logo%20(5).webp" alt="B&W Trailer Hitches" loading="lazy"></div>
      <div class="logo-card"><img src="brand-logo%20(6).webp" alt="Extang" loading="lazy"></div>
      <div class="logo-card"><img src="brand-logo%20(7).webp" alt="Bushwacker" loading="lazy"></div>
      <div class="logo-card"><img src="brand-logo%20(8).webp" alt="Dee Zee" loading="lazy"></div>
      <div class="logo-card"><img src="brand-logo%20(12).webp" alt="BAK Industries" loading="lazy"></div>
    </div>
  </div>

  <!-- Row 2 — scrolls right -->
  <div class="marquee-wrapper">
    <div class="marquee-track row-2" id="row2">
      <div class="logo-card"><img src="brand-logo%20(9).webp" alt="Rigid Industries" loading="lazy"></div>
      <div class="logo-card"><img src="brand-logo%20(10).webp" alt="Air Lift" loading="lazy"></div>
      <div class="logo-card"><img src="brand-logo%20(11).webp" alt="Mickey Thompson" loading="lazy"></div>
      <div class="logo-card"><img src="brand-logo%20(13).webp" alt="ReadyLIFT" loading="lazy"></div>
      <div class="logo-card"><img src="brand-logo%20(14).webp" alt="WeatherTech" loading="lazy"></div>
      <div class="logo-card"><img src="brand-logo%20(15).webp" alt="Retrax" loading="lazy"></div>
      <div class="logo-card"><img src="brand-logo%20(17).webp" alt="Smittybilt" loading="lazy"></div>
      <div class="logo-card"><img src="westin.webp" alt="Westin" loading="lazy"></div>
      <div class="logo-card"><img src="husky.webp" alt="Husky Liners" loading="lazy"></div>
      <div class="logo-card"><img src="bedrug.webp" alt="BedRug" loading="lazy"></div>
      <div class="logo-card"><img src="curt.webp" alt="CURT" loading="lazy"></div>
      <div class="logo-card"><img src="baja%20designs%20logo.webp" alt="Baja Designs" loading="lazy"></div>
      <div class="logo-card"><img src="poison-spyder-logo.webp" alt="Poison Spyder" loading="lazy"></div>
      <div class="logo-card"><img src="brand-logo%20(3).webp" alt="TrailFX" loading="lazy"></div>
    </div>
  </div>

</section>

<script>
  var r1 = document.getElementById('row1');
  var r2 = document.getElementById('row2');

  // Duplicate until track fills at least 2x viewport so no gaps
  var vw = window.innerWidth || 1200;
  while(r1.scrollWidth < vw * 2.2) r1.innerHTML += r1.innerHTML;
  while(r2.scrollWidth < vw * 2.2) r2.innerHTML += r2.innerHTML;

  // Set exact pixel scroll distance via CSS variables — guarantees seamless loop
  var w1 = r1.scrollWidth / 2;
  var w2 = r2.scrollWidth / 2;
  r1.style.setProperty('--w1', '-' + w1 + 'px');
  r2.style.setProperty('--w2-neg', '-' + w2 + 'px');
  // CSS vars need to be on the track element — move to :root for keyframe access
  document.documentElement.style.setProperty('--w1', '-' + w1 + 'px');
  document.documentElement.style.setProperty('--w2-neg', '-' + w2 + 'px');

  function reportHeight(){
    var sentinel=document.getElementById('height-sentinel');
    var h=sentinel?(sentinel.offsetTop+sentinel.offsetHeight):Math.max(document.body.scrollHeight,document.body.offsetHeight,document.documentElement.scrollHeight,document.documentElement.offsetHeight);
    window.parent.postMessage(JSON.stringify({height:h}),'*');
  }
  document.addEventListener('DOMContentLoaded', reportHeight);
  window.addEventListener('load', function(){
    [0,200,500,1000,2000,3500].forEach(function(t){ setTimeout(reportHeight,t); });
  });
  window.addEventListener('resize', reportHeight);
  if(window.ResizeObserver){ new ResizeObserver(reportHeight).observe(document.body); }
</script>

<div id="height-sentinel" style="height:1px;width:1px;visibility:hidden;pointer-events:none;"></div>

<script>
(function(){var active=false,startY=0,lastY=0,rafId=null;document.addEventListener('mousedown',function(e){if(e.button!==1)return;if(e.target.closest('a'))return;e.preventDefault();active=true;startY=e.clientY;lastY=e.clientY;document.body.style.cursor='ns-resize';tick();});document.addEventListener('mousemove',function(e){if(active)lastY=e.clientY;});document.addEventListener('mouseup',function(e){if(e.button!==1||!active)return;active=false;document.body.style.cursor='';if(rafId){cancelAnimationFrame(rafId);rafId=null;}});function tick(){if(!active){rafId=null;return;}var dy=lastY-startY;if(Math.abs(dy)>5)window.scrollBy(0,dy*0.12);rafId=requestAnimationFrame(tick);}})();
</script></body>
</html>
