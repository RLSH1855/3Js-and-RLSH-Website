<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Confirm Your Appointment | Rhino Linings of Signal Hill</title>
<!-- A confirmation link is private to one customer. Keep it out of search. -->
<meta name="robots" content="noindex, nofollow"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;600&family=Oswald:wght@600;700&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{overscroll-behavior:none}
  body{overflow-x:hidden;background:#f4f5f7;color:#222;font-family:Inter,system-ui,sans-serif;line-height:1.55}

  .wrap{max-width:560px;margin:0 auto;padding:48px 20px 56px}

  .card{background:#fff;border:1px solid #d9dce1;padding:32px 24px;text-align:center}

  .eyebrow{font-family:Oswald,sans-serif;font-weight:600;font-size:12px;letter-spacing:1.2px;
    text-transform:uppercase;color:#8B0000;margin-bottom:10px}
  h1{font-family:Montserrat,sans-serif;font-weight:800;font-size:26px;line-height:1.2;color:#111;margin-bottom:12px}
  .lede{color:#555;font-size:16px}

  .when{font-family:Montserrat,sans-serif;font-weight:800;font-size:22px;color:#111;
    margin:32px 0 6px;line-height:1.3}
  .service{color:#555;font-size:16px;margin-bottom:32px}

  .btn{display:inline-block;width:100%;background:#8B0000;color:#fff;border:0;
    font-family:Montserrat,sans-serif;font-weight:800;font-size:16px;letter-spacing:.4px;
    padding:16px 24px;cursor:pointer;text-transform:uppercase}
  .btn:hover{background:#6f0000}
  .btn:disabled{opacity:.55;cursor:default}

  .done{border-left:4px solid #1c7a44;background:#f1f8f3;padding:16px;text-align:left;color:#14532d;font-weight:600}
  .warn{border-left:4px solid #8B0000;background:#fdf3f3;padding:16px;text-align:left;color:#7a1414;font-weight:600}

  .foot{margin-top:32px;text-align:center;color:#555;font-size:14px}
  .foot a{color:#8B0000;font-weight:600;text-decoration:none}
  .foot a:hover{text-decoration:underline}

  @media (min-width:768px){
    .wrap{padding:64px 20px}
    .card{padding:40px 36px}
    h1{font-size:30px}
    .when{font-size:26px}
    .btn{width:auto;min-width:280px}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card">
      <p class="lede" id="loading">Loading your appointment…</p>
    </div>

    <p class="foot">
      Rhino Linings of Signal Hill · 1855 E 29th Street, Signal Hill, CA 90755<br/>
      <a href="tel:5624246744">562-424-6744</a>
    </p>
  </div>

<script>
(function () {
  var card = document.getElementById('card');
  var token = new URLSearchParams(location.search).get('t');

  function html(s) { card.innerHTML = s; }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* The shop's timezone, not the phone's. A customer travelling must not be
     told a different time than the one written on the work order. */
  function whenText(iso) {
    var raw = String(iso);
    var s = raw.indexOf('T') > -1 ? raw : raw.replace(' ', 'T') + 'Z';
    if (s.charAt(s.length - 1) !== 'Z') s += 'Z';
    var d = new Date(s);
    if (isNaN(d.getTime())) return raw;
    return d.toLocaleString('en-US', {
      weekday: 'long', month: 'long', day: 'numeric',
      hour: 'numeric', minute: '2-digit',
      timeZone: 'America/Los_Angeles'
    });
  }

  function notFound() {
    html('<p class="eyebrow">Rhino Linings of Signal Hill</p>' +
         '<h1>We couldn\'t find that appointment</h1>' +
         '<p class="warn">This link may have expired or been mistyped. ' +
         'Give us a call on 562-424-6744 and we\'ll sort it out.</p>');
  }

  function confirmed(startsAt) {
    html('<p class="eyebrow">Rhino Linings of Signal Hill</p>' +
         '<h1>You\'re confirmed</h1>' +
         '<p class="when">' + esc(whenText(startsAt)) + '</p>' +
         '<p class="done">Thanks — we\'ve got you down. See you then. ' +
         'If anything changes, call us on 562-424-6744.</p>');
    reportHeight();
  }

  function show(a) {
    if (a.already_confirmed) return confirmed(a.starts_at);

    html('<p class="eyebrow">Rhino Linings of Signal Hill</p>' +
         '<h1>' + (a.first_name ? 'Hi ' + esc(a.first_name) + ', please' : 'Please') +
         ' confirm your appointment</h1>' +
         '<p class="when">' + esc(whenText(a.starts_at)) + '</p>' +
         (a.service ? '<p class="service">' + esc(a.service) + '</p>' : '<div style="height:16px"></div>') +
         '<button class="btn" id="go">Confirm this appointment</button>');

    document.getElementById('go').addEventListener('click', function () {
      var btn = this;
      btn.disabled = true;
      btn.textContent = 'Confirming…';

      fetch('/api/appointment-confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ t: token })
      })
        .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, b: b }; }); })
        .then(function (res) {
          if (res.ok) return confirmed(a.starts_at);
          html('<p class="eyebrow">Rhino Linings of Signal Hill</p>' +
               '<h1>We couldn\'t confirm that</h1>' +
               '<p class="warn">' + esc(res.b.message || 'Please call us on 562-424-6744.') + '</p>');
          reportHeight();
        })
        .catch(function () {
          btn.disabled = false;
          btn.textContent = 'Confirm this appointment';
        });
    });

    reportHeight();
  }

  if (!token) { notFound(); return; }

  fetch('/api/appointment-confirm?t=' + encodeURIComponent(token))
    .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
    .then(show)
    .catch(notFound);
})();
</script>

<script>
  function reportHeight(){
    var h = Math.max(document.body.scrollHeight,document.body.offsetHeight,document.documentElement.scrollHeight,document.documentElement.offsetHeight);
    window.parent.postMessage(JSON.stringify({height:h}),'*');
  }
  document.addEventListener('DOMContentLoaded',reportHeight);
  window.addEventListener('load',function(){
    [0,200,500,1000,2000,3500].forEach(function(t){setTimeout(reportHeight,t);});
  });
  window.addEventListener('resize',reportHeight);
  if(window.ResizeObserver){new ResizeObserver(reportHeight).observe(document.body);}
</script>
</body>
</html>
