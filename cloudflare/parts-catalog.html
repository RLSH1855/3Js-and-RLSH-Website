<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tonneau Covers — RLSH Truck &amp; Jeep Outfitters · Signal Hill, CA</title>
<meta name="description" content="Tonneau covers, running boards, lighting, bumpers, skid plates and more truck &amp; Jeep accessories — professionally installed at 3J's Auto Body, Signal Hill, CA." />
<meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon.ico">
<link rel="canonical" href="https://www.3jsautobody.com/parts-catalog" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#ffffff; --surface:#ffffff; --surface2:#f4f4f1;
    --border:rgba(20,18,14,.08); --border-strong:rgba(20,18,14,.18);
    --fg:#1a1815; --fg-muted:rgba(26,24,21,.62); --fg-dim:rgba(26,24,21,.42);
    --accent:#8B0000; --gap:18px; --pad:18px; --cols:3;
    --display:'Montserrat', sans-serif;
    --body:'Inter', system-ui, sans-serif;
    --mono:'JetBrains Mono', ui-monospace, monospace;
  }
  *,*::before,*::after { box-sizing: border-box; }
  html,body { margin:0; padding:0; }
  html { overscroll-behavior: none; }
  body { font-family: var(--body); background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased; overflow-x:hidden; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  svg { display:inline-block; vertical-align: middle; }
  ::selection { background: var(--accent); color:#fff; }

  .app { background: var(--bg); color: var(--fg); }

  /* ── Buttons ── */
  .btn-primary { background: var(--accent); color:#fff; border:0; padding: 12px 18px; font-family: var(--display); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; cursor: pointer; transition: filter .15s, transform .1s; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-ghost { background: transparent; color: var(--fg); border: 1px solid var(--border-strong); padding: 12px 18px; font-family: var(--display); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; cursor: pointer; }
  .btn-ghost:hover { background: rgba(255,255,255,.04); }
  .icon-btn { background:transparent; border:0; color: var(--fg); width:40px; height:40px; cursor:pointer; position:relative; display:inline-flex; align-items:center; justify-content:center; border-radius: 0; }
  .icon-btn:hover { background: rgba(255,255,255,.05); }
  .icon-btn svg { width: 20px; height: 20px; }
  .cart-dot { position:absolute; top:6px; right:4px; background: var(--accent); color:#fff; font-size: 10px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 0; display:flex; align-items:center; justify-content:center; padding: 0 4px; }

  /* ── Header ── */
  .hdr { position: relative; z-index: 50; background: rgba(10,10,12,.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
  .hdr-promo { background: #000; color: #fff; font-size: 12px; height: 34px; overflow: hidden; display:flex; align-items:center; mask-image: linear-gradient(to right, transparent 0%, #000 10%, #000 90%, transparent 100%); -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 10%, #000 90%, transparent 100%); }
  .hdr-promo .bolt { color: var(--accent); display:inline-flex; }
  .hdr-promo .bolt svg { width: 14px; height: 14px; }
  .hdr-ticker { display:flex; white-space:nowrap; animation: ticker-scroll 38s linear infinite; }
  .hdr-ticker-item { display:inline-flex; align-items:center; gap: 8px; padding: 0 60px; }
  @keyframes ticker-scroll { 0% { transform:translateX(0); } 100% { transform:translateX(-50%); } }

  .hdr-main { display: grid; grid-template-columns: 1fr; align-items: center; padding: 12px 48px; }
  .logo { display:flex; align-items:center; gap: 10px; }
  .logo img { height: 60px; display:block; }

  .search { display:flex; align-items:center; gap: 8px; max-width: 680px; width: 100%; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); padding: 0 14px; height: 42px; }
  .search:focus-within { border-color: var(--accent); }
  .search-ico { color: rgba(255,255,255,.4); display:inline-flex; }
  .search-ico svg { width: 18px; height: 18px; }
  .search input { flex:1; background: transparent; border: 0; color: #fff; font-size: 14px; outline: none; min-width: 0; }
  .search input::placeholder { color: rgba(255,255,255,.3); }
  .search kbd { font-family: var(--mono); font-size: 11px; color: rgba(255,255,255,.3); border: 1px solid rgba(255,255,255,.15); padding: 2px 6px; border-radius: 2px; }

  .hdr-actions { display:flex; align-items:center; gap: 8px; }
  .garage-pill { display:flex; align-items:center; gap:8px; padding:6px 12px 6px 8px; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.07); cursor:pointer; transition:border-color .15s,background .15s; }
  .garage-pill:hover { border-color: var(--accent); background: rgba(255,255,255,.11); }
  .garage-pill-ico { color: var(--accent); display:inline-flex; flex-shrink:0; }
  .garage-pill-ico svg { width: 26px; height: 26px; }
  .garage-pill-txt { display:flex; flex-direction: column; align-items: flex-start; line-height: 1.15; flex:1; }
  .garage-pill-label { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.45); }
  .garage-pill-vehicle { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .03em; color: #fff; }
  .garage-pill-swap { color: rgba(255,255,255,.35); flex-shrink:0; }
  .garage-pill-swap svg { width: 16px; height: 16px; }

  /* ── Garage iframe popup ── */
  /* z-index sits ABOVE the sitewide nav (z 1000); at 500 the full-height nav
     overlapped and clipped the top of the popup. */
  .garage-popup-root { position: fixed; inset: 0; z-index: 1400; display: flex; align-items: center; justify-content: center; }
  .garage-popup-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); animation: fadeIn .2s ease-out; }
  .garage-popup-card { position: relative; z-index: 1; width: min(1260px, 95vw); max-height: 92vh; overflow-y: auto; animation: fadeIn .22s ease-out; box-shadow: 0 24px 64px rgba(0,0,0,.6); background: #fff; }
  .garage-popup-close { position: absolute; top: 12px; right: 12px; z-index: 10; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.15); color: #fff; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1; transition: background .15s; }
  .garage-popup-close:hover { background: var(--accent); }
  .garage-popup-iframe { width: 100%; height: min(630px, 92vh); border: 0; display: block; }
  .garage-popup-footer { display: flex; border-top: 1px solid #e8e8e8; }
  .garage-popup-skip { flex: 1; padding: 12px; background: none; border: none; font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #aaa; cursor: pointer; text-align: center; transition: color .15s; }
  .garage-popup-skip:hover { color: #666; }
  .garage-popup-clear { flex: 1; padding: 12px; background: none; border: none; border-left: 1px solid #e8e8e8; font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #8B0000; cursor: pointer; text-align: center; transition: color .15s; }
  .garage-popup-clear:hover { color: #6d0000; }
  @media (max-width: 767px) {
    .garage-popup-root { align-items: flex-end; }
    .garage-popup-card { width: 100%; max-width: 100%; height: 100dvh; max-height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    .garage-popup-iframe { flex: 1; height: auto; min-height: 0; }
  }
  /* ── Product Detail Popup ── */
  .detail-popup-root { position: fixed; inset: 0; z-index: 500; display: flex; align-items: flex-end; justify-content: center; }
  .detail-popup-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); animation: fadeIn .2s ease-out; }
  .detail-popup-card { position: relative; z-index: 1; width: 100%; max-height: 94vh; overflow: hidden; animation: slideUp .25s ease-out; background: #fff; border-radius: 0; box-shadow: 0 -8px 48px rgba(0,0,0,.5); }
  .detail-popup-close { position: absolute; top: 10px; right: 10px; z-index: 10; background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.2); color: #fff; width: 36px; height: 36px; border-radius: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; line-height: 1; transition: background .15s; }
  .detail-popup-close:hover { background: #8B0000; }
  .detail-popup-iframe { width: 100%; height: 90vh; border: 0; display: block; }
  @media(min-width:768px) {
    .detail-popup-root { align-items: center; }
    .detail-popup-card { width: 980px; max-width: 96vw; max-height: 92vh; border-radius: 0; animation: fadeIn .2s ease-out; }
    .detail-popup-iframe { height: 88vh; }
  }

  .hdr-nav { display:flex; align-items: center; gap: 4px; padding: 0 18px; border-top: 1px solid rgba(255,255,255,.07); overflow-x: auto; scrollbar-width: none; }
  .hdr-nav::-webkit-scrollbar { display: none; }
  .nav-item { font-family: var(--display); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; padding: 14px 14px; color: rgba(255,255,255,.5); white-space: nowrap; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s, border-color .15s; }
  .nav-item:hover { color: #fff; }
  .nav-item.active { color: #fff; border-bottom-color: var(--accent); }

  /* ── Category tabs ── */
  .cat-tabs { background: #212530; border-top: 1px solid rgba(255,255,255,.06); border-bottom: 2px solid var(--accent); }
  .cat-tabs-hint { display:flex; align-items:center; gap:8px; padding:8px 20px; font-family:var(--display); font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:rgba(255,255,255,.85); background:none; border-bottom:1px solid rgba(255,255,255,.08); }
  .cat-tabs-hint::before { content:''; display:block; width:3px; height:14px; background:var(--accent); flex-shrink:0; }
  .cat-tabs-inner { display:flex; overflow-x:auto; scrollbar-width:none; padding:0; }
  .cat-tabs-inner::-webkit-scrollbar { display:none; }
  .cat-tab { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:14px 18px; font-family:var(--display); font-size:11px; font-weight:800; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,.90); background:none; border:none; border-bottom:3px solid transparent; border-right:1px solid rgba(255,255,255,.10); white-space:nowrap; flex:0 0 auto; min-height:48px; cursor:pointer; transition:color .2s,border-color .2s,background .2s; }
  .cat-tab:last-child { border-right:none; }
  .cat-tab:hover:not(.cat-tab-empty) { color:#fff; background:rgba(255,255,255,.08); }
  .cat-tab.cat-tab-active { color:#fff; border-bottom-color:var(--accent); letter-spacing:2.5px; }
  .cat-tab.cat-tab-empty { opacity:.35; cursor:default; }
  .cat-tab-badge { background:rgba(255,255,255,.1); font-size:9px; font-weight:800; padding:2px 6px; letter-spacing:1px; }
  .cat-tab.cat-tab-active .cat-tab-badge { background:var(--accent); }
  .cat-tab-soon { font-size:8px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:rgba(255,255,255,.3); border:1px solid rgba(255,255,255,.15); padding:2px 6px; }

  /* Mobile: show trigger button, hide all tabs */
  @media(max-width:767px){
    .cat-tabs-inner { justify-content:center; padding:0; overflow-x:hidden; }
    .cat-tab { display:none !important; }
    .cat-mob-trigger { display:inline-flex; align-items:center; gap:8px; background:none; border:none; color:#fff; font-family:var(--display); font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; cursor:pointer; padding:14px 20px; border-bottom:3px solid var(--accent); }
    .cat-mob-trigger svg { opacity:.7; }
    .cat-dd-backdrop { position:fixed; inset:0; z-index:49; }
    .cat-dd { position:absolute; left:0; right:0; top:100%; z-index:50; background:#fff; border-top:3px solid var(--accent); border-bottom:1px solid var(--border); box-shadow:0 8px 24px rgba(0,0,0,.15); }
    .cat-dd-item { display:flex; align-items:center; justify-content:space-between; width:100%; background:none; border:none; border-bottom:1px solid var(--border); padding:14px 20px; font-family:var(--display); font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--fg); cursor:pointer; text-align:left; }
    .cat-dd-item:last-child { border-bottom:none; }
    .cat-dd-item:hover { background:var(--surface); }
    .cat-dd-item.cat-dd-active { color:var(--accent); }
  }
  @media(min-width:768px){
    .cat-mob-trigger { display:none; }
    .cat-dd,.cat-dd-backdrop { display:none !important; }
  }

  /* ── Hero ── */
  .hero { background: #000; border-bottom: 1px solid var(--border); min-height: 400px; }
  .hero-grid { display: grid; grid-template-columns: 1fr 1fr; min-height: 400px; }
  .hero-copy { padding: 56px 48px; display:flex; flex-direction: column; justify-content: center; gap: 16px; }
  .hero-kicker { font-family: var(--mono); font-size: 11px; letter-spacing: .2em; color: var(--accent); }
  .hero-copy h1 { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 5vw, 64px); line-height: .95; margin: 0; letter-spacing: -.01em; text-transform: uppercase; color: #fff; }
  .hero-copy .amp { color: var(--accent); font-weight: 400; }
  .hero-copy p { color: rgba(255,255,255,.55); max-width: 440px; font-size: 15px; line-height: 1.5; margin: 0; }
  .hero-cta { display:flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .hero-art { position: relative; overflow: hidden; }
  .hero-tag { position: absolute; bottom: 16px; left: 16px; font-family: var(--display); font-size: 12px; letter-spacing: .22em; padding: 8px 16px; background: rgba(255,255,255,.13); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,.32); color: #fff; font-weight: 700; text-transform: uppercase; }

  /* ── Crumbs ── */
  .crumbs { max-width: 1440px; margin: 0 auto; padding: 14px 24px; font-family: var(--body); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 500; color: var(--fg-muted); display:flex; align-items:center; gap: 10px; flex-wrap: wrap; }
  .crumbs a { cursor: pointer; }
  .crumbs a:hover { color: var(--accent); }
  .crumb-sep { color: var(--fg-dim); }
  .crumb-now { color: #000; font-weight: 700; }

  /* ── Mobile search row (inside header, mobile only) ── */
  .mob-search-row { display: none; }

  /* ── Vehicle bar — desktop hidden, mobile only ── */
  .mob-vehicle-bar { display:none; width:350px; margin-left:auto; }
  .mob-vehicle-bar.no-vehicle { background:var(--accent); }
  .mob-vehicle-bar.has-vehicle { background:#1c1c1e; border-bottom:1px solid rgba(255,255,255,.08); }
  .mob-vehicle-bar:hover { filter:brightness(1.08); }
  .mvb-ico { display:inline-flex; flex-shrink:0; }
  .mvb-ico svg { width:26px; height:26px; }
  .mob-vehicle-bar.no-vehicle .mvb-ico svg { stroke:#fff; }
  .mob-vehicle-bar.has-vehicle .mvb-ico svg { stroke:var(--accent); }
  .mvb-label { flex:1; font-family:var(--display); font-weight:700; font-size:16px; letter-spacing:.06em; text-transform:uppercase; color:#fff; }
  .mvb-chev { display:inline-flex; flex-shrink:0; }
  .mvb-chev svg { width:18px; height:18px; stroke:rgba(255,255,255,.6); }

  /* ── Mobile sticky bar ── */
  .mobile-bar { display: none; }

  /* ── Chip rail ── */
  .chip-rail { max-width: 1440px; margin: 0 auto; padding: 0 24px 16px; display:flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip-pill { display:inline-flex; align-items:center; gap: 8px; background: var(--surface2); border: 1px solid var(--border); color: var(--fg); padding: 6px 8px 6px 12px; border-radius: 0; font-size: 12px; font-weight: 500; cursor: pointer; transition: border-color .15s; }
  .chip-pill:hover { border-color: var(--accent); }
  .chip-pill .chip-x { display:inline-flex; opacity: .6; }
  .chip-pill .chip-x svg { width: 12px; height: 12px; }
  .chip-clear { background: transparent; border:0; color: var(--accent); font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; padding: 6px 8px; }

  /* ── Layout ── */
  .catalog { max-width: 1440px; margin: 0 auto; padding-bottom: 80px; }
  .layout { display: grid; gap: 32px; padding: 0 24px 0 8px; }
  .layout-sidebar { grid-template-columns: 220px 1fr; }

  /* ── Sidebar ── */
  .sidebar { position: sticky; top: 168px; align-self: start; max-height: calc(100vh - 180px); overflow-y: auto; overscroll-behavior: contain; padding-right: 8px; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

  .filter-panel { display:flex; flex-direction: column; }
  .fit-banner { background: var(--surface2); border-top: 3px solid var(--accent); padding: 14px 16px; margin-bottom: 16px; }
  .fit-banner-label { font-family: var(--mono); font-size: 10px; letter-spacing: .15em; color: var(--fg-dim); }
  .fit-banner-vehicle { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .02em; color: var(--accent); margin-top: 2px; text-transform: uppercase; }
  .fit-toggle { display:flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; cursor: pointer; user-select: none; }
  .fit-toggle input { display: none; }
  .fit-toggle-track { position: relative; width: 32px; height: 18px; background: var(--border-strong); border-radius: 999px; transition: background .15s; flex-shrink: 0; }
  .fit-toggle-thumb { position:absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: #fff; border-radius: 50%; transition: transform .15s; }
  .fit-toggle input:checked + .fit-toggle-track { background: var(--accent); }
  .fit-toggle input:checked + .fit-toggle-track .fit-toggle-thumb { transform: translateX(14px); }

  .filter-section { border-bottom: 1px solid var(--border); }
  .filter-section-head { display:flex; justify-content: space-between; align-items: center; width: 100%; background:transparent; border: 0; padding: 16px 0; color: var(--fg); font-family: var(--display); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 15px; cursor: pointer; }
  .filter-section-chev { transition: transform .2s; color: var(--fg-muted); display:inline-flex; }
  .filter-section-chev svg { width: 12px; height: 12px; }
  .filter-section.open .filter-section-chev { transform: rotate(180deg); }
  .filter-section-body { padding-bottom: 14px; display:flex; flex-direction: column; gap: 8px; }

  .check-row { display:flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px; padding: 4px 0; }
  .check-row input { display: none; }
  .check-box { width: 16px; height: 16px; border: 1.5px solid var(--border-strong); border-radius: 0; flex-shrink: 0; display:inline-flex; align-items: center; justify-content: center; transition: background .15s, border-color .15s; }
  .check-box .check-mark { color: #fff; opacity: 0; transition: opacity .1s; display:inline-flex; }
  .check-box .check-mark svg { width: 12px; height: 12px; }
  .check-row input:checked + .check-box { background: var(--accent); border-color: var(--accent); }
  .check-row input:checked + .check-box .check-mark { opacity: 1; }
  .check-label { flex: 1; }
  .check-count { color: var(--fg-dim); font-family: var(--mono); font-size: 11px; }

  /* Price */
  .price-range { display:flex; flex-direction: column; gap: 14px; }
  .price-inputs { display:grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .price-inputs label { display:flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); padding: 8px 10px; }
  .price-inputs label span { font-family: var(--mono); font-size: 10px; color: var(--fg-dim); }
  .price-inputs input { background:transparent; border: 0; color: var(--fg); width: 100%; min-width: 0; font-family: var(--mono); outline: none; font-size: 13px; }
  .price-slider { position: relative; height: 24px; }
  .price-track { position: absolute; left: 8px; right: 8px; top: 11px; height: 2px; background: var(--border-strong); }
  .price-track-fill { position: absolute; top: 0; height: 100%; background: var(--accent); }
  .price-slider input[type="range"] { -webkit-appearance: none; appearance: none; position: absolute; inset: 0; width: 100%; background: transparent; pointer-events: none; height: 24px; }
  .price-slider input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--fg); border: 2px solid var(--accent); pointer-events: auto; cursor: pointer; }
  .price-slider input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--fg); border: 2px solid var(--accent); pointer-events: auto; cursor: pointer; }
  .price-legend { display:flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--fg-muted); }

  /* ── Toolbar ── */
  .toolbar { display:flex; justify-content: space-between; align-items: center; padding: 8px 0 16px; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
  .toolbar-left { display:flex; align-items: center; gap: 12px; }
  .toolbar-right { display:flex; align-items: center; gap: 16px; }
  .tb-count { font-size: 13px; color: var(--fg-muted); }
  .tb-count strong { color: var(--fg); font-weight: 700; }
